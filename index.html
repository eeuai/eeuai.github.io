<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게임 창고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}

/* Layout concept: a shelf of game cartridges. Each game is a cartridge with a colored label. Games live inside this page itself, so anyone with the link can play without signing in. */
:root {
  --bg: #e8edee;
  --surface: #f7f9f9;
  --ink: #10181c;
  --muted: #58656b;
  --line: #c9d3d5;
  --accent: #0a8f67;
  --accent-ink: #ffffff;
  --warm: #f0c13a;
  --danger: #c43d2f;
  --f-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1517;
    --surface: #152023;
    --ink: #e4eeeb;
    --muted: #8fa09b;
    --line: #26363a;
    --accent: #3fd9a0;
    --accent-ink: #04231a;
    --warm: #e6b92e;
    --danger: #ff7a6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1517;
  --surface: #152023;
  --ink: #e4eeeb;
  --muted: #8fa09b;
  --line: #26363a;
  --accent: #3fd9a0;
  --accent-ink: #04231a;
  --warm: #e6b92e;
  --danger: #ff7a6b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; }
.mono { font-family: var(--f-mono); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 2px solid var(--ink); }
.brand { min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
h1 { margin: 2px 0 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(36px, 8vw, 56px); line-height: 1.05; letter-spacing: -.01em; text-wrap: balance; }
.top-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 18px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); transition: transform .12s ease, background .12s ease; }
.btn:hover { background: var(--bg); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 13px; }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.note { margin: 14px 0 0; font-size: 13px; color: var(--muted); }

/* view tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.tabs button { min-height: 38px; padding: 6px 16px; border: 1.5px solid var(--ink); border-radius: 999px; background: transparent; cursor: pointer; font-weight: 600; }
.tabs button:hover { background: var(--surface); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs .n { margin-left: 6px; font-family: var(--f-mono); font-size: 12px; opacity: .75; }

/* shelf */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 22px; margin-top: 26px; }
.cart { --c: var(--warm); display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 6px 6px 16px 16px; overflow: hidden; }
.cart-label { position: relative; height: 112px; background: var(--c); border-bottom: 1.5px solid var(--ink); overflow: hidden; color: #10181c; }
.cart-glyph { position: absolute; left: 14px; bottom: -22px; font-family: var(--f-display); font-size: 108px; line-height: 1; }
.cart-tag { position: absolute; top: 10px; right: 12px; font-size: 11px; letter-spacing: .12em; padding: 2px 7px; border: 1.5px solid #10181c; border-radius: 3px; }
.cart-body { display: flex; flex-direction: column; flex: 1; gap: 8px; padding: 14px 16px 12px; min-width: 0; }
.cart h3 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
.cart p { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.meta { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.cart-actions { display: flex; gap: 8px; padding: 0 16px 14px; }
.cart-actions .btn { flex: 1; }
.cart-actions .btn.danger { flex: 0 0 auto; }
.cart-grip { height: 12px; border-top: 1.5px solid var(--ink); background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 7px); opacity: .85; }

/* empty */
.empty { margin-top: 26px; padding: 36px 24px; border: 2px dashed var(--line); border-radius: 10px; display: grid; gap: 12px; justify-items: start; }
.empty h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.empty p { margin: 0; max-width: 56ch; color: var(--muted); }
.empty .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }

/* panels */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; background: rgba(8, 14, 16, .6); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { width: 100%; max-width: 520px; margin: 4vh 0; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 10px; padding: 22px; display: grid; gap: 16px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.field { display: grid; gap: 6px; }
.field label, .field .lab { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
input[type="text"], input[type="url"], textarea { width: 100%; padding: 9px 11px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; }
input[type="text"]:focus, input[type="url"]:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { min-height: 120px; resize: vertical; font-family: var(--f-mono); font-size: 12.5px; }
input[type="file"] { font-size: 13px; max-width: 100%; }
.seg { display: flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; min-height: 38px; border: 0; background: transparent; cursor: pointer; font-weight: 600; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.err { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--danger); }

/* player */
.player { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.player-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1.5px solid var(--ink); }
.player-title { display: flex; flex-direction: column; min-width: 0; }
.player-title strong { font-size: 16px; overflow-wrap: anywhere; }
.player-title span { font-size: 12px; color: var(--muted); }
.player-actions { display: flex; gap: 8px; }
.stage { position: relative; flex: 1; min-height: 0; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.stage-msg { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; background: var(--bg); }
.stage-msg p { margin: 0; max-width: 44ch; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; max-width: calc(100% - 32px); padding: 10px 16px; background: var(--ink); color: var(--bg); border-radius: 6px; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Game Shelf · 둘이서 만든 게임 모음</div>
      <h1>게임 창고</h1>
    </div>
    <div class="top-right">
      <span class="count" id="count"></span>
      <button class="btn primary" id="open-add" type="button">게임 올리기</button>
    </div>
  </header>
  <main id="list" aria-live="polite"></main>
</div>

<div class="sheet" id="add-sheet" hidden>
  <form class="panel" id="add-form" novalidate>
    <h2>게임 올리기</h2>
    <div class="field">
      <label for="f-title">게임 이름</label>
      <input type="text" id="f-title" maxlength="40" autocomplete="off" placeholder="예: 점 잡기">
    </div>
    <div class="field">
      <label for="f-desc">한 줄 소개 <span class="hint">(선택)</span></label>
      <input type="text" id="f-desc" maxlength="100" autocomplete="off" placeholder="예: 15초 동안 점을 최대한 많이 누르기">
    </div>
    <div class="field">
      <label for="f-by">올린 사람 이름 <span class="hint">(선택)</span></label>
      <input type="text" id="f-by" maxlength="20" autocomplete="off" placeholder="예: 민수">
    </div>
    <div class="field">
      <label for="f-file">게임 HTML 파일</label>
      <input type="file" id="f-file" accept=".html,.htm,text/html">
    </div>
    <details class="field" id="setup">
      <summary class="lab" style="cursor:pointer">GitHub 연결 설정 <span class="hint" id="setup-state"></span></summary>
      <div class="field" style="margin-top:10px">
        <label for="f-repo">저장소 <span class="hint">(아이디/저장소이름)</span></label>
        <input type="text" id="f-repo" autocomplete="off" placeholder="예: myid/my-arcade">
      </div>
      <div class="field" style="margin-top:10px">
        <label for="f-token">GitHub 토큰 <span class="hint">(이 브라우저에만 저장돼요)</span></label>
        <input type="text" id="f-token" autocomplete="off" spellcheck="false" placeholder="github_pat_..." style="-webkit-text-security:disc">
        <p class="hint" style="margin:6px 0 0">GitHub → Settings → Developer settings → Fine-grained tokens에서 이 저장소만 선택하고 Contents 권한을 Read and write로 만드세요.</p>
      </div>
    </details>
    <p class="err" id="add-err" role="alert"></p>
    <div class="form-actions">
      <button type="button" class="btn" id="add-cancel">취소</button>
      <button type="submit" class="btn primary" id="add-submit">올리기</button>
    </div>
  </form>
</div>

<div class="player" id="player" hidden>
  <div class="player-bar">
    <div class="player-title"><strong id="p-title"></strong><span id="p-by"></span></div>
    <div class="player-actions">
      <button class="btn small" id="p-full" type="button">전체화면</button>
      <button class="btn small" id="p-close" type="button">닫기</button>
    </div>
  </div>
  <div class="stage">
    <iframe id="p-frame" title="게임 화면" sandbox="allow-scripts allow-pointer-lock allow-forms" allow="fullscreen"></iframe>
    <div class="stage-msg" id="p-msg" hidden><p id="p-msg-text"></p></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CFG_KEY = 'arcade.cfg';
  var COLORS = ['#9b86e3', '#4a9be8', '#f0c13a', '#ef8a62', '#5fc48f', '#e66f9b'];
  var games = [];
  var pending = {}; // id -> html, for games uploaded in this session and not yet deployed

  function loadCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch (e) { return {}; } }
  function saveCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} }
  function guessRepo() {
    var h = location.hostname;
    if (/\.github\.io$/.test(h)) {
      var owner = h.split('.')[0];
      var repo = location.pathname.split('/')[1];
      return owner + '/' + (repo || h);
    }
    return '';
  }

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4500);
  }

  /* ---------- list ---------- */
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
  function fmtDate(ms) { var d = new Date(ms); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render() {
    var list = $('list'); list.textContent = '';
    $('count').textContent = '게임 ' + games.length + '개';
    if (!games.length) {
      var box = el('div', 'empty');
      box.appendChild(el('h2', null, '아직 게임이 없어요'));
      box.appendChild(el('p', null, '오른쪽 위 "게임 올리기"로 첫 게임을 올려 보세요.'));
      list.appendChild(box); return;
    }
    var shelf = el('div', 'shelf');
    var hasToken = !!loadCfg().token;
    games.slice().sort(function (a, b) { return b.createdAt - a.createdAt; }).forEach(function (g) {
      var card = el('article', 'cart');
      card.style.setProperty('--c', COLORS[hash(g.id) % COLORS.length]);
      var label = el('div', 'cart-label');
      label.appendChild(el('span', 'cart-glyph', Array.from(g.title)[0] || '?'));
      label.appendChild(el('span', 'cart-tag mono', 'HTML'));
      var body = el('div', 'cart-body');
      body.appendChild(el('h3', null, g.title));
      if (g.desc) body.appendChild(el('p', null, g.desc));
      var meta = el('div', 'meta');
      if (g.by) meta.appendChild(el('span', null, g.by));
      meta.appendChild(el('span', null, fmtDate(g.createdAt)));
      body.appendChild(meta);
      var acts = el('div', 'cart-actions');
      var play = el('button', 'btn primary', '플레이'); play.type = 'button';
      play.addEventListener('click', function () { openPlayer(g); });
      acts.appendChild(play);
      if (hasToken) {
        var del = el('button', 'btn danger small', '삭제'); del.type = 'button';
        del.addEventListener('click', function () { removeGame(g, del); });
        acts.appendChild(del);
      }
      card.appendChild(label); card.appendChild(body); card.appendChild(acts); card.appendChild(el('div', 'cart-grip'));
      shelf.appendChild(card);
    });
    list.appendChild(shelf);
  }

  function loadGames() {
    fetch('games.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { games = Array.isArray(d) ? d : []; render(); })
      .catch(function () {
        games = []; render();
        if (location.protocol === 'file:') toast('파일로 직접 열면 목록을 못 불러와요. GitHub Pages 주소로 열어 주세요.');
      });
  }

  /* ---------- player ---------- */
  function openPlayer(g) {
    $('p-title').textContent = g.title;
    $('p-by').textContent = g.by || '';
    $('p-msg').hidden = true;
    var frame = $('p-frame'); frame.removeAttribute('srcdoc');
    $('player').hidden = false;
    document.body.style.overflow = 'hidden';
    if (pending[g.id] != null) { frame.srcdoc = pending[g.id]; return; }
    fetch(g.file + '?t=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) { frame.srcdoc = html; })
      .catch(function () {
        $('p-msg-text').textContent = '게임 파일을 불러오지 못했어요. 방금 올렸다면 1~2분 뒤에 다시 열어 보세요.';
        $('p-msg').hidden = false;
      });
  }
  function closePlayer() {
    $('player').hidden = true; $('p-frame').removeAttribute('srcdoc'); $('p-frame').src = 'about:blank';
    document.body.style.overflow = '';
  }
  $('p-close').addEventListener('click', closePlayer);
  $('p-full').addEventListener('click', function () {
    var f = $('p-frame'); if (f.requestFullscreen) f.requestFullscreen().catch(function () {});
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!$('player').hidden) closePlayer(); else if (!$('add-sheet').hidden) closeAdd(); }
  });

  /* ---------- GitHub API ---------- */
  function toB64(str) {
    var b = new TextEncoder().encode(str), s = '', n = 0x8000;
    for (var i = 0; i < b.length; i += n) s += String.fromCharCode.apply(null, b.subarray(i, i + n));
    return btoa(s);
  }
  function fromB64(b64) {
    var s = atob(b64.replace(/\s/g, '')), b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return new TextDecoder().decode(b);
  }
  function gh(cfg, path, opts) {
    opts = opts || {};
    return fetch('https://api.github.com/repos/' + cfg.repo + path, {
      method: opts.method || 'GET',
      headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + cfg.token, 'Content-Type': 'application/json' },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (r.ok) return r.json();
      return r.json().catch(function () { return {}; }).then(function (j) {
        var e = new Error(j.message || r.statusText); e.status = r.status; throw e;
      });
    });
  }
  function explain(e) {
    if (e.status === 401) return '토큰이 올바르지 않아요. 다시 확인해 주세요.';
    if (e.status === 403) return '이 토큰에는 쓰기 권한이 없어요. Contents를 Read and write로 만들어 주세요.';
    if (e.status === 404) return '저장소를 찾을 수 없거나 토큰이 이 저장소에 접근할 수 없어요.';
    if (e instanceof TypeError) return '인터넷 연결을 확인해 주세요.';
    return '실패했어요: ' + e.message;
  }
  function getBranch(cfg) {
    return gh(cfg, '').then(function (info) {
      if (info.permissions && info.permissions.push === false) { var e = new Error('no push'); e.status = 403; throw e; }
      return info.default_branch;
    });
  }
  // read games.json, apply fn, write back; retry on conflicts
  function updateIndex(cfg, branch, fn, tries) {
    tries = tries == null ? 3 : tries;
    return gh(cfg, '/contents/games.json?ref=' + encodeURIComponent(branch)).catch(function (e) {
      if (e.status === 404) return { content: '', sha: null };
      throw e;
    }).then(function (cur) {
      var list = [];
      try { list = cur.content ? JSON.parse(fromB64(cur.content)) : []; } catch (e) { list = []; }
      var next = fn(list);
      var body = { message: 'games.json 업데이트', content: toB64(JSON.stringify(next, null, 2)), branch: branch };
      if (cur.sha) body.sha = cur.sha;
      return gh(cfg, '/contents/games.json', { method: 'PUT', body: body }).then(function () { return next; });
    }).catch(function (e) {
      if ((e.status === 409 || e.status === 422) && tries > 1) return updateIndex(cfg, branch, fn, tries - 1);
      throw e;
    });
  }

  /* ---------- add dialog ---------- */
  function openAdd() {
    var cfg = loadCfg();
    $('f-repo').value = cfg.repo || guessRepo();
    $('f-token').value = cfg.token || '';
    $('setup').open = !(cfg.token && ($('f-repo').value));
    $('setup-state').textContent = cfg.token ? '(저장됨)' : '(처음 한 번만 필요해요)';
    $('add-err').textContent = '';
    $('add-sheet').hidden = false;
    $('f-title').focus();
  }
  function closeAdd() { $('add-sheet').hidden = true; $('add-form').reset(); }
  $('open-add').addEventListener('click', openAdd);
  $('add-cancel').addEventListener('click', closeAdd);
  $('add-sheet').addEventListener('mousedown', function (e) { if (e.target === $('add-sheet')) closeAdd(); });

  $('add-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var err = $('add-err'); err.textContent = '';
    var title = $('f-title').value.trim();
    var file = $('f-file').files[0];
    var repo = $('f-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/+$/, '');
    var token = $('f-token').value.trim();
    if (!title) { err.textContent = '게임 이름을 적어 주세요.'; return; }
    if (!file) { err.textContent = 'HTML 파일을 골라 주세요.'; return; }
    if (!/\.html?$/i.test(file.name)) { err.textContent = '.html 파일만 올릴 수 있어요.'; return; }
    if (file.size > 10 * 1024 * 1024) { err.textContent = '파일이 너무 커요 (10MB 이하).'; return; }
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { err.textContent = '저장소를 "아이디/저장소이름" 형태로 적어 주세요.'; $('setup').open = true; return; }
    if (!token) { err.textContent = 'GitHub 토큰을 입력해 주세요.'; $('setup').open = true; return; }
    var cfg = { repo: repo, token: token };
    var btn = $('add-submit'); btn.disabled = true; btn.textContent = '올리는 중…';
    var id = Math.random().toString(16).slice(2, 10) + Date.now().toString(16).slice(-4);
    var entry = { id: id, title: title, desc: $('f-desc').value.trim(), by: $('f-by').value.trim(), createdAt: Date.now(), file: 'games/' + id + '.html' };
    var html;
    file.text().then(function (t) {
      html = t;
      return getBranch(cfg);
    }).then(function (branch) {
      cfg.branch = branch;
      return gh(cfg, '/contents/' + entry.file, { method: 'PUT', body: { message: '게임 추가: ' + title, content: toB64(html), branch: branch } })
        .then(function () { return updateIndex(cfg, branch, function (l) { return l.concat([entry]); }); });
    }).then(function () {
      saveCfg({ repo: cfg.repo, token: cfg.token });
      pending[id] = html;
      games.push(entry); render();
      closeAdd();
      toast('올렸어요! 1~2분 뒤 다른 사람에게도 보여요.');
    }).catch(function (e) {
      err.textContent = explain(e);
      if (e.status === 401 || e.status === 403 || e.status === 404) $('setup').open = true;
    }).then(function () { btn.disabled = false; btn.textContent = '올리기'; });
  });

  /* ---------- delete ---------- */
  function removeGame(g, btn) {
    if (!confirm('"' + g.title + '" 게임을 삭제할까요?')) return;
    var cfg = loadCfg(); btn.disabled = true;
    getBranch(cfg).then(function (branch) {
      return gh(cfg, '/contents/' + g.file + '?ref=' + encodeURIComponent(branch)).then(function (f) {
        return gh(cfg, '/contents/' + g.file, { method: 'DELETE', body: { message: '게임 삭제: ' + g.title, sha: f.sha, branch: branch } });
      }, function (e) { if (e.status !== 404) throw e; })
        .then(function () { return updateIndex(cfg, branch, function (l) { return l.filter(function (x) { return x.id !== g.id; }); }); });
    }).then(function () {
      games = games.filter(function (x) { return x.id !== g.id; }); delete pending[g.id]; render();
      toast('삭제했어요. 1~2분 뒤 모두에게 반영돼요.');
    }).catch(function (e) { btn.disabled = false; toast(explain(e)); });
  }

  loadGames();
})();

</script>
</body>
</html>
