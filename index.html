/* Layout concept: a shelf of game cartridges. Each game is a cartridge with a colored label. Games live inside this page itself, so anyone with the link can play without signing in. */
:root {

.empty .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }

/* panels */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; background: rgba(8, 14, 16, .6); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { width: 100%; max-width: 520px; margin: 4vh 0; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 10px; padding: 22px; display: grid; gap: 16px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.field { display: grid; gap: 6px; }
.field label, .field .lab { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
input[type="text"], input[type="url"], textarea { width: 100%; padding: 9px 11px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; }

.seg { display: flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }

.err { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--danger); }

    <div class="field">

</div>

003cdiv class=\"rbNote\">환생하면 💼 직장(직업·직급·경력)이 \u003cb>처음으로\u003c/b> 돌아가요. 대신 ✨ 포인트로 \u003cb>영구 강화\u003c/b>를 살 수 있어요! (코인과 상점 아이템은 그대로예요)\u003c/div>\n    \u003cdiv id=\"perks\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"gcard bonusCard\">\u003cdiv class=\"gi\">🎁\u003c/div>\u003cb>무료 용돈\u003c/b>\u003cspan id=\"bonusTxt\">1분마다 받을 수 있어요. 얼마가 나올지는 운!\u003c/span>\u003cbutton id=\"bonusBtn\">받기\u003c/button>\u003c/div>\n  \u003cdiv class=\"wNote\">💼 일하면 30초마다 월급이 들어와요. 자격증을 따서 더 좋은 직장으로 옮기고, 오래 다니면 승진해서 월급이 올라요!\u003cbr>모은 돈은 주식·부동산·사업에 투자해서 \u003cb>자산이 돈을 벌게\u003c/b> 만들어 봐요.\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"petView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"pCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\">\u003cdiv>🐾 장착 효과\u003c/div>\u003cdiv id=\"petSum\" class=\"petSum\">\u003c/div>\u003c/div>\u003c/div>\n  \u003cdiv class=\"xTitle\">🥚 알 부화소 \u003csmall>(부화할 때마다 알 가격이 15%씩 올라요)\u003c/small>\u003c/div>\n  \u003cdiv id=\"eggGrid\" class=\"eggGrid\">\u003c/div>\n  \u003cdiv id=\"hatchStage\">\u003c/div>\n  \u003cdiv class=\"xTitle\">🎒 장착 중 \u003csmall id=\"slotInfo\">\u003c/small>\u003c/div>\n  \u003cdiv id=\"eqRow\" class=\"eqRow\">\u003c/div>\n  \u003cdiv class=\"eqBtns\">\u003cbutton id=\"petBest\">⭐ 최고 펫 자동 장착\u003c/button>\u003cbutton id=\"petSlotBtn\">\u003c/button>\u003c/div>\n  \u003cdiv class=\"xTitle\">📖 펫 도감 \u003csmall>(같은 펫을 또 뽑으면 레벨업! 레벨마다 효과 +25%)\u003c/small>\u003c/div>\n  \u003cdiv id=\"petGrid\" class=\"petGrid\">\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"honView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"hCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\">\u003cdiv id=\"honSum\">\u003c/div>\u003c/div>\u003c/div>\n  \u003cdiv class=\"xTitle\">👑 VIP 멤버십 \u003csmall>(차례대로 올라가요)\u003c/small>\u003c/div>\n  \u003cdiv id=\"vipBox\" class=\"vipBox\">\u003c/div>\n  \u003cdiv class=\"xTitle\">💎 명품 컬렉션 \u003csmall>(한 번 사면 영원히! 급여·부업 수입 증가, 슬롯 당 =\"my\">💼 내 자산\u003c/button>\u003cbutton data-s=\"ipo\">🎟️ 공모주\u003c/button>\u003c/div>\n  \u003cdiv id=\"kSum\" class=\"kSum\">\u003c/div>\n  \u003cdiv class=\"stkWrap\">\n    \u003cdiv class=\"stkLeft\">\n      \u003cdiv class=\"stkFilter\" id=\"stkFilter\">\u003c/div>\n      \u003cdiv class=\"srowHead\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>종목\u003c/span>\u003cspan>현재가 / 등락\u003c/span>\u003cspan>추이\u003c/span>\u003c/div>\n      \u003cdiv id=\"stkRows\" class=\"stkRows\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"stkRight\" id=\"stkDetail\">\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"kIpoSec\" class=\"detPage\">\u003c/div>\n  \u003cdiv class=\"stkBottom\">\n    \u003cdiv id=\"kNewsSec\">\u003cdiv class=\"xTitle\">📰 실시간 뉴스 \u003csmall>(종목 이름이 붙은 뉴스를 누르면 그 종목으로 가요)\u003c/small>\u003c/div>\u003cdiv class=\"stkFilter\" id=\"nFilt\">\u003cbutton data-f=\"all\">전체\u003c/button>\u003cbutton data-f=\"big\">🔥 주요 뉴스\u003c/button>\u003cbutton data-f=\"up\">📈 호재\u003c/button>\u003cbutton data-f=\"dn\">📉 악재\u003c/button>\u003cbutton data-f=\"stk\">🏢 종목 뉴스\u003c/button>\u003cbutton data-f=\"mine\">💼 내 종목\u003c/button>\u003c/div>\u003cdiv id=\"newsFeed\" class=\"newsFeed\">\u003c/div>\u003c/div>\n    \u003cdiv id=\"kMySec\">\u003cdiv class=\"xTitle\">💼 내 주식 자산\u003c/div>\u003cdiv id=\"kMySum\">\u003c/div>\u003cdiv id=\"portf\" class=\"portf\">\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"coView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"oCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\" id=\"coHead\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"coBody\" class=\"coBody\">\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"reView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"rCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\" id=\"reHead\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"regBox\" class=\"regBox\">\u003c/div>\n  \u003cdiv id=\"reGrid\" class=\"reGrid\">\u003c/div>\u003cdiv id=\"reDet\" class=\"detPage\" style=\"display:none\">\u003c/div>\n  \u003cdiv class=\"wNote\">🏠 살 때 취득세 3% · 팔 때 중개수수료 0.5% + 남긴 돈의 20% 양도소득세 · 월세는 1분마다 들어와요 (공실 10% 반영)\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"cryView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"yCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\" id=\"cryHead\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"cryGrid\" class=\"reGrid\">\u003c/div>\n  \u003cdiv class=\"wNote\">🪙 2초마다 가격이 변해요 · 쉬는 날 없이 24시간 거래 · 수수료 0.1% · 가격제한폭이 없어서 하루에 몇 배가 될 수도, 휴지조각이 될 수도 있어요! 밈코인은 특히 조심!\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"luxView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"lCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\" id=\"luxHead\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"fameBox\" class=\"fameBox\">\u003c/div>\n  \u003cdiv id=\"luxGrid\" class=\"luxGrid\">\u003c/div>\n  \u003cdiv class=\"wNote\">💎 살 때 사치세 20% · 팔 때 중고 수수료 10% · 유지비는 1분마다 나가요 · 시계·와인·그림·섬은 값이 오르내리고, 차·요트·비행기는 갈수록 값이 떨어져요\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"fxView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"xCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\" id=\"fxHead\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"fxGrid\" class=\"reGrid\">\u003c/div>\u003cdiv id=\"fxDet\" class=\"detPage\" style=\"display:none\">\u003c/div>\n  \u003cdiv class=\"wNote\">🌍 3초마다 가격이 변해요 · 살 때·팔 때 수수료가 있어요 · 불황엔 금·달러·엔화(안전자산)가 오르고, 호황엔 원자재가 올라요\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"finView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"fCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\" id=\"finHead\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"xTitle\">👥 친구 랭킹 \u003csmall>(내 랭킹 코드를 단톡방에 올리고, 친구 코드를 붙여넣으면 순위가 나와요)\u003c/small>\u003c/div>\n  \u003cdiv class=\"frBox\">\n    \u003cdiv id=\"frMyRank\" class=\"frMyRank\">\u003c/div>\n    \u003cdiv id=\"frList\">\u003c/div>\n    \u003cdiv class=\"frIn\">\n      \u003clabel>✏️ 내 닉네임 \u003cinput id=\"frNick\" maxlength=\"12\" placeholder=\"예: 민준\">\u003c/label>\n      \u003cdiv class=\"frBtns\">\u003cbutton id=\"frMake\">📋 내 랭킹 코드 복사\u003c/button>\u003cbutton id=\"frShare\">📤 공유하기\u003c/button>\u003c/div>\n      \u003ctextarea id=\"frMyCode\" rows=\"2\" readonly placeholder=\"여기에 내 랭킹 코드가 나와요\">\u003c/textarea>\n      \u003ctextarea id=\"frIn\" rows=\"3\" placeholder=\"친구가 보낸 랭킹 코드를 여기에 붙여넣어요 (단톡방 내용을 통째로 붙여넣어도 코드만 알아서 찾아요)\">\u003c/textarea>\n      \u003cbutton id=\"frAdd\">👥 친구 기록 추가\u003c/button>\n    \u003c/div>\n    \u003csmall style=\"opacity:.75\">💡 코드에는 만든 순간의 순자산이 담겨요. 더 부자가 되면 새 코드를 다시 올려요! 숫자를 고치면 코드가 고장 나서 안 들어가요.\u003c/small>\n  \u003c/div>\n  \u003cdiv class=\"xTitle\">🏆 대한민국 부자 순위 \u003csmall>(순자산 = 현금 + 예금 + 주식 + 부동산 + 채권 + 도시 + 컬렉션 + 회사 + 명품 + 코인 − 빚)\u003c/small>\u003c/div>\n  \u003cdiv id=\"rankBox\" class=\"rankBox\">\u003c/div>\n  \u003cdiv class=\"xTitle\">📊 내 자산 구성\u003c/div>\n  \u003cdiv id=\"assetBox\" class=\"assetBox\">\u003c/div>\n  \u003cdiv class=\"xTitle\">💸 현금 흐름 · 가계부 \u003csmall>(1분마다 들어오고 나가는 돈)\u003c/small>\u003c/div>\n  \u003cdiv id=\"cfBox\" class=\"loanBox\">\u003c/div>\n  \u003cdiv class=\"xTitle\">💳 대출 \u003csmall>(빚도 자산이다? 이자는 1분마다 불어나요!)\u003c/small>\u003c/div>\n  \u003cdiv id=\"loanBox\" class=\"loanBox\">\u003c/div>\n  \u003cdiv class=\"xTitle\">📜 채권 \u003csmall>(돈을 빌려주고 만기에 이자를 받아요 · 위험할수록 이자가 높아요)\u003c/small>\u003c/div>\n  \u003cdiv id=\"bondBox\" class=\"loanBox\">\u003c/div>\n\u003c/div>\n\n\u003c!-- 배당표 -->\n\u003cdiv class=\"overlay\" id=\"payModal\">\u003cdiv class=\"paybox\">\n  \u003ch2>📊 배당표 &amp; 확률\u003c/h2>\n  \u003ctable id=\"payTable\">\u003c/table>\n  \u003cdiv class=\"note\" id=\"payNote\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"payClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003c!-- 상점 -->\n\u003cdiv class=\"overlay\" id=\"shopModal\">\u003cdiv class=\"paybox shopBox\">\n  \u003cdiv class=\"shopHead\">\u003ch2>🛍️ 상점\u003c/h2>\u003cdiv class=\"shopTop\">💰 \u003cb id=\"shopCoins\">0\u003c/b>\u003c/div>\u003c/div>\n  \u003cdiv class=\"shopTabs\" id=\"shopTabs\">\u003c/div>\n  \u003cdiv class=\"rerollRow\" id=\"rerollRow\">\u003cspan>🔥 오늘의 특가! 할인율은 랜덤이에요. 새로고침하면 다시 뽑아요.\u003cbr>\u003csmall style=\"opacity:.8\">🛡️ 슬롯 아이템은 베팅이 \u003cb id=\"shopCap\">\u003c/b> 이하일 때만 효과가 있어요\u003c/small>\u003c/span>\u003cbutton class=\"shopBtn2\" id=\"rerollBtn\">🔄 30코인\u003c/button>\u003c/div>\n  \u003cdiv id=\"offers\" class=\"igrid\">\u003c/div>\n  \u003cdiv id=\"boxPanel\">\n    \u003cdiv class=\"boxCard\">\n      \u003cdiv id=\"boxIcon\">🎁\u003c/div>\n      \u003cdiv id=\"boxResult\">뭐가 나올지는 운에 달렸어요!\u003c/div>\n      \u003cdiv class=\"boxBtns\">\u003cbutton class=\"shopBtn2\" id=\"boxBtn\">일반 박스 · 250\u003c/button>\u003cbutton class=\"shopBtn2 prem\" id=\"boxBtn2\">프리미엄 박스 · 2,000\u003c/button>\u003c/div>\n      \u003cdiv class=\"odds\">\n        \u003cb>일반\u003c/b> \u003cspan class=\"r-common\">일반 70%\u003c/span> 코인 50~200 · \u003cspan class=\"r-rare\">희귀 22%\u003c/span> 보험권/물약 · \u003cspan class=\"r-epic\">영웅 7%\u003c/span> 영구 업그레이드 Lv+1 · \u003cspan class=\"r-legend\">전설 1%\u003c/span> 3,000코인 + 업그레이드 Lv+2\u003cbr>\n        \u003cb>프리미엄\u003c/b> \u003cspan class=\"r-common\">일반 40%\u003c/span> 코인 800~2,400 · \u003cspan class=\"r-rare\">희귀 35%\u003c/span> 무료 스핀권·부스터 세트 · \u003cspan class=\"r-epic\">영웅 20%\u003c/span> 업그레이드 Lv+1 + 1,500코인 · \u003cspan class=\"r-legend\">전설 5%\u003c/span> 12,000코인 + 업그레이드 Lv+3\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"shopClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003c!-- 업적 -->\n\u003cdiv class=\"overlay\" id=\"achModal\">\u003cdiv class=\"paybox shopBox\">\n  \u003cdiv class=\"shopHead\">\u003ch2>🏆 업적\u003c/h2>\u003cdiv class=\"shopTop\" id=\"achSum\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"achList\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"achClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\u003c!-- 행운의 룰렛 -->\n\u003cdiv class=\"overlay\" id=\"wheelModal\">\u003cdiv class=\"paybox shopBox\" style=\"max-width:460px !important\">\n  \u003cdiv class=\"shopHead\">\u003ch2>🎡 행운의 룰렛\u003c/h2>\u003cdiv class=\"shopTop\">💰 \u003cb id=\"wheelCoins\">0\u003c/b>\u003c/div>\u003c/div>\n  \u003cdiv class=\"wheelWrap\">\u003cdiv class=\"wPtr\">\u003c/div>\u003ccanvas id=\"wheelCv\" width=\"340\" height=\"340\">\u003c/canvas>\u003c/div>\n  \u003cdiv id=\"wheelRes\" class=\"wheelRes\">20분마다 무료로 한 번 돌릴 수 있어요!\u003c/div>\n  \u003cdiv class=\"boxBtns\">\u003cbutton class=\"shopBtn2\" id=\"wheelFree\">무료 돌리기\u003c/button>\u003cbutton class=\"shopBtn2 prem\" id=\"wheelPaid\">코인으로 돌리기\u003c/button>\u003c/div>\n  \u003cdiv class=\"odds\" id=\"wheelOdds\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"wheelClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003c!-- 일일 보상 -->\n\u003cdiv class=\"overlay\" id=\"dayModal\">\u003cdiv class=\"paybox shopBox\">\n  \u003cdiv class=\"shopHead\">\u003ch2>📅 일일 보상\u003c/h2>\u003cdiv class=\"shopTop\" id=\"daySum\">\u003c/div>\u003c/div>\n  \u003ch3 class=\"secH\">📅 출석 체크 \u003csmall id=\"attInfo\">\u003c/small>\u003c/h3>\n  \u003cdiv id=\"attGrid\">\u003c/div>\n  \u003cbutton class=\"shopBtn2\" id=\"attBtn\" style=\"width:100%;margin:8px 0\">오늘 출석하기\u003c/button>\n  \u003ch3 class=\"secH\">📝 오늘의 퀘스트 \u003csmall>(매일 자정에 새로 바뀌어요)\u003c/small>\u003c/h3>\n  \u003cdiv id=\"questList\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"dayClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003c!-- 통계 -->\n\u003cdiv class=\"overlay\" id=\"statModal\">\u003cdiv class=\"paybox shopBox\">\n  \u003cdiv class=\"shopHead\">\u003ch2>📊 통계 & 도감\u003c/h2>\u003c/div>\n  \u003cdiv id=\"statGrid\">\u003c/div>\n  \u003ch3 class=\"secH\">📈 최근 코인 추이\u003c/h3>\n  \u003cdiv id=\"curveBox\">\u003c/div>\n  \u003ch3 class=\"secH\">🃏 도감 \u003csmall>(그림별 일치 기록)\u003c/small>\u003c/h3>\n  \u003cdiv id=\"colGrid\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"statClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003c!-- 설정 -->\n\u003cdiv class=\"overlay\" id=\"setModal\">\u003cdiv class=\"paybox shopBox\" style=\"max-width:520px !important\">\n  \u003cdiv class=\"shopHead\">\u003ch2>⚙️ 설정\u003c/h2>\u003c/div>\n  \u003clabel class=\"setRow\">\u003cspan>🎵 배경음악 \u003csmall>(8비트 BGM)\u003c/small>\u003c/span>\u003cinput type=\"checkbox\" id=\"setBgm\">\u003c/label>\n  \u003clabel class=\"setRow\">\u003cspan>⚡ 이펙트 줄이기 \u003csmall>(컴퓨터가 느릴 때 켜요)\u003c/small>\u003c/span>\u003cinput type=\"checkbox\" id=\"setLow\">\u003c/label>\n  \u003clabel class=\"setRow\">\u003cspan>📳 화면 흔들림 끄기\u003c/span>\u003cinput type=\"checkbox\" id=\"setShake\">\u003c/label>\n  \u003ch3 class=\"secH\">💾 저장 코드 \u003csmall>(다른 컴퓨터로 옮길 때)\u003c/small>\u003c/h3>\n  \u003ctextarea id=\"saveBox\" rows=\"3\" placeholder=\"여기에 저장 코드가 나와요 / 붙여넣어서 불러와요\" spellcheck=\"false\">\u003c/textarea>\n  \u003cdiv class=\"boxBtns\">\u003cbutton class=\"shopBtn2\" id=\"saveExp\">내보내기\u003c/button>\u003cbutton class=\"shopBtn2\" id=\"saveCopy\">복사\u003c/button>\u003cbutton class=\"shopBtn2 prem\" id=\"saveImp\">불러오기\u003c/button>\u003c/div>\n  \u003ch3 class=\"secH\">⌨️ 단축키\u003c/h3>\n  \u003cdiv class=\"note\">스페이스바: 슬롯 돌리기 · Esc: 오토 정지 / 연출 건너뛰기\u003c/div>\n  \u003ch3 class=\"secH\">🗑️ 계정 삭제 \u003csmall>(이 기기에 저장된 게임 기록을 전부 지워요)\u003c/small>\u003c/h3>\n  \u003cbutton class=\"shopBtn2\" id=\"wipeBtn\" style=\"width:100%;background:linear-gradient(#ff8a8a,#d92b2b);color:#fff;border-color:#7a0a0a\">🗑️ 이 기기의 게임 기록 삭제\u003c/button>\n  \u003cbutton class=\"closeBtn\" id=\"setClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003c!-- 처음 안내 -->\n\u003cdiv class=\"overlay\" id=\"introModal\">\u003cdiv class=\"paybox shopBox\" style=\"max-width:480px !important\">\n  \u003cdiv class=\"shopHead\">\u003ch2>🎰 환영해요!\u003c/h2>\u003c/div>\n  \u003cdiv class=\"introList\">\n    \u003cp>💼 \u003cb>돈 벌기\u003c/b> 탭에서 직장에 다니며 월급을 받고, 자격증을 따서 더 좋은 직장으로 옮겨요.\u003c/p>\n    \u003cp>🎰 \u003cb>슬롯\u003c/b>에서 번 코인을 걸어서 불려요. 7️⃣7️⃣7️⃣이 나오면 \u003cb>누적 잭팟\u003c/b>까지!\u003c/p>\n    \u003cp>🛍️ \u003cb>상점\u003c/b>에서 아이템과 스킨을 사고, 🏆 업적과 📅 일일 보상으로 코인을 더 받아요.\u003c/p>\n    \u003cp>🎡 \u003cb>행운의 룰렛\u003c/b>은 20분마다 공짜! 가끔 나타나는 \u003cb>🪙 황금 코인\u003c/b>도 놓치지 마세요.\u003c/p>\n    \u003cp>✨ 충분히 벌면 \u003cb>환생\u003c/b>해서 더 강해질 수 있어요.\u003c/p>\n    \u003cp class=\"small\">모든 코인은 게임 속 가짜 코인이에요.\u003c/p>\n  \u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"introClose\">시작하기!\u003c/button>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"overlay\" id=\"offModal\">\u003cdiv class=\"paybox shopBox\" style=\"max-width:440px !important\">\n  \u003cdiv class=\"shopHead\">\u003ch2>💤 다녀오셨어요?\u003c/h2>\u003c/div>\n  \u003cdiv id=\"offBody\" class=\"offBody\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"offClose\">받기!\u003c/button>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"overlay\" id=\"ceoModal\">\u003cdiv class=\"paybox shopBox\" style=\"max-width:460px !important\">\n  \u003cdiv class=\"shopHead\">\u003ch2>📩 사장님, 결정해 주세요!\u003c/h2>\u003c/div>\n  \u003ch3 id=\"ceoT\" style=\"color:#ffe27a;margin:6px 0\">\u003c/h3>\u003cp id=\"ceoD\" style=\"color:#fff;line-height:1.6\">\u003c/p>\n  \u003cdiv class=\"row2\" style=\"flex-direction:column\">\u003cbutton class=\"btn2 blue\" id=\"ceoA\">\u003c/button>\u003cbutton class=\"btn2 gold\" id=\"ceoB\">\u003c/button>\u003c/div>\n  \u003cdiv id=\"ceoR\" style=\"color:#9cf58a;font-weight:900;text-align:center;margin:10px 0;min-height:1.4em\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"ceoOk\">확인\u003c/button>\n\u003c/div>\u003c/div>\n\u003cdiv id=\"toasts\">\u003c/div>\n\n\u003cscript>\nconst SYM = [\"🍒\",\"🍋\",\"🔔\",\"⭐\",\"💎\",\"7️⃣\"];\nconst W   = [26,24,20,14,9,7];\nconst MULT= [5,8,15,30,60,200];\nconst PAIR= [0.5,0.5,1,1.5,2,3];\nconst START = 100, BOX_PRICE = 250, REROLL = 30, MAXLV = 10;\nconst $ = id => document.getElementById(id);\nconst UNITS=[[1e20,\"해\"],[1e16,\"경\"],[1e12,\"조\"],[1e8,\"억\"]];\nfunction fmt(n){ n=Math.round(n); const a=Math.abs(n); if(a\u003c1e8) return n.toLocaleString(\"ko-KR\"); for(const [v,u] of UNITS){ if(a>=v){ const x=n/v; return (+x.toFixed(Math.abs(x)>=100?0:(Math.abs(x)>=10?1:2)))+u; } } return String(n); }\n\n/* ---------- 상태 + 저장 ---------- */\nconst S = { charm:0, amp:0, potion:0, ins:0, free:0, jb:0, dbl:0, glove:0, batt:0, clv:0, cd:0, skins:{gold:true}, skin:\"gold\", rb:0, soul:0, run:0, perk:{click:0,auto:0,start:0,disc:0,slot:0,coin:0}, lc:0, la:0, clicks:0, bonusAt:0,\n  sluck:0, mag:0, sins:0, cbUntil:0, abUntil:0, pairL:0, triL:0, jpL:0, refL:0, aspL:0, critL:0, toolL:0, autod:0, offL:0, rbL:0,\n  stat:{spins:0,tri:0,jp:0,mega:0,top:0,buys:0,maxLc:0,maxLa:0,bet:0,won:0,wins:0,golden:0,wheel:0,poolTop:0,playSec:0,race:0,raceWin:0,slothWin:0,gigs:0,paydays:0,maxRank:0,stkProfit:0,div:0,limUp:0,trades:0,interest:0,robo:0,coProfit:0,themeHit:0,seized:0,reProfit:0,bondGain:0,defaults:0,fxTrades:0,fxProfit:0,ceo:0,jeonse:0}, ach:{},\n  pool:1000, dq:{date:\"\",spins:0,clicks:0,gigs:0,wins:0,tri:0,wager:0,earn:0,claimed:{}}, att:{last:\"\",streak:0}, wheelAt:0,\n  hist:[], curve:[], col:{tri:[0,0,0,0,0,0],pair:[0,0,0,0,0,0]}, set:{bgm:false,lowfx:false,noshake:false}, seen:false,\n  bc:{}, pets:{}, eq:[], petSlots:3, ecnt:{}, coll:{}, vip:0, don:0,\n  city:{lots:8,tiles:[]}, bcnt:{}, stk:{}, stkP:{}, stkA:{}, stkO:{}, stkH:{}, stkHi:{}, stkLo:{}, watch:{}, news:[], mkt:{day:1,tick:0,reg:0,idxO:1000,idxH:[],br:3.5},\n  car:{job:0,rank:0,exp:0,texp:0,edu:{},study:null,gig:null,acc:0,payIn:30,mig:false}, acl:0, abuy:{un:false,click:true,auto:true,city:true}, acla:{un:false,on:true}, bank:{dep:0,cap:1,rate:0},\n  eps:{}, cdl:{}, dvol:{}, ath:{}, atl:{}, theme:{}, lstreak:{}, earnDay:{},\n  co:{on:false,name:\"냠냠상사\",emp:0,office:1,mk:0,rd:0,morale:80,strike:0,ipo:false,profit:0,autoHire:false,autoOff:false,hist:[],tmul:1,tmulUntil:0},\n  fx:null,\n  re:null, tlog:[], nick:\"\", pid:\"\", friends:[], lux:null, ipo:null, cry:null, sauto:{}, bonds:[], lastView:\"slot\",\n  loan:{debt:0,credit:700}, rankBest:99 };\nlet offlineInfo=null;\nlet itemsOn=true;\nconst itemCap=()=>Math.round(2000*Math.max(1,Math.floor(Math.sqrt(best/3000))));\nconst fxn=n=>S.set.lowfx?Math.max(1,Math.ceil(n/3)):n;\nconst dkey=(t=Date.now())=>{ const d=new Date(t); return d.getFullYear()+\"-\"+String(d.getMonth()+1).padStart(2,\"0\")+\"-\"+String(d.getDate()).padStart(2,\"0\"); };\nfunction dq(){ const k=dkey(); if(S.dq.date!==k) S.dq={date:k,spins:0,clicks:0,gigs:0,wins:0,tri:0,wager:0,earn:0,claimed:{}}; return S.dq; }\nconst scl=()=>Math.max(1,Math.floor(Math.sqrt(best/3000)));\nlet curMag=false;\nfunction mergeS(src){ for(const k in src){ if(!(k in S)) continue; if(S[k] && typeof S[k]==='object' && !Array.isArray(S[k])) Object.assign(S[k],src[k]); else S[k]=src[k]; } }\nlet offlineGain = 0;\nlet coins = START, best = START, bet = 10, busy = false, shown = START;\nvar wiped=false;\nfunction save(){ if(wiped) return; try{ localStorage.setItem(\"jp777\", JSON.stringify({coins,best,charm:S.charm,amp:S.amp,potion:S.potion,ins:S.ins,free:S.free,jb:S.jb,dbl:S.dbl,glove:S.glove,batt:S.batt,clv:S.clv,cd:S.cd,skins:S.skins,skin:S.skin,rb:S.rb,soul:S.soul,run:S.run,perk:S.perk,lc:S.lc,la:S.la,clicks:S.clicks,bonusAt:S.bonusAt,S:S,ts:Date.now()})); }catch(e){} }\nvar migMsg=0;\nfunction load(){\n  try{ const d=JSON.parse(localStorage.getItem(\"jp777\")||\"null\");\n    if(d && typeof d.coins===\"number\"){ if(d.S) mergeS(d.S); coins=d.coins; best=Math.max(d.best||0,coins); S.charm=d.charm|0; S.amp=d.amp|0; S.potion=d.potion|0; S.ins=d.ins|0; S.free=d.free|0; S.jb=d.jb|0; S.dbl=d.dbl|0; S.glove=d.glove|0; S.batt=d.batt|0; S.clv=d.clv|0; S.cd=d.cd|0; if(d.skins) Object.assign(S.skins,d.skins); if(d.skin&&S.skins[d.skin]) S.skin=d.skin; S.rb=d.rb|0; S.soul=d.soul|0; S.run=d.run||0; if(d.perk) Object.assign(S.perk,d.perk);\n      S.lc=d.lc|0; S.la=d.la|0; S.clicks=d.clicks|0; S.bonusAt=d.bonusAt||0;\n      if(!S.car.mig){ S.car.mig=true; const sev=Math.round((15*Math.pow(1.32,S.lc)+25*Math.pow(1.34,S.la))*1.5); if(S.lc+S.la>0){ coins+=sev; migMsg=sev; } S.lc=0; S.la=0; }\n      const el=Math.min((Date.now()-(d.ts||Date.now()))/1000,7200+3600*S.offL); if(el>30){ const parts={auto:Math.floor(clickPay()*el*.5),city:Math.floor(cityRate()*el),robo:0,bank:Math.floor(S.bank.dep*(0.008+0.002*S.bank.rate)*el/60)}; offlineGain=parts.auto+parts.city+parts.robo+parts.bank; if(offlineGain>0){ offlineInfo={el,parts}; coins+=offlineGain; best=Math.max(best,coins); S.stat.interest+=parts.bank; } }\n      shown=coins; }\n  }catch(e){}\n}\n\n/* ---------- 확률 / 배당 (업그레이드 반영) ---------- */\nfunction luck(){ return 0.06*S.charm + (itemsOn&&S.potion>0 ? 0.5 : 0) + (itemsOn&&S.sluck>0 ? 1.5 : 0) + 0.03*S.perk.slot + bonusLuck(); }\nfunction effW(){ const ew=W.map((w,i)=> i>=2 ? w*(1+luck()) : w); if(itemsOn&&S.jb>0) ew[5]*=2; return ew; }\nfunction payBonus(){ return (1 + 0.03*S.amp)*(1+bonusSlot()); }\nfunction pick(ew){ const tot=ew.reduce((a,b)=>a+b); let r=Math.random()*tot; for(let i=0;i\u003cew.length;i++){ if((r-=ew[i])\u003c0) return i; } return 0; }\n\n/* ---------- 소리 (아케이드 / 8비트 스타일) ---------- */\nlet actx, master, echoIn, noiseBuf, vol = 80;\ntry{ const v=localStorage.getItem(\"jp777vol\"); if(v!==null) vol=+v; }catch(e){}\nfunction ac(){\n  if(!actx){\n    actx = new (window.AudioContext||window.webkitAudioContext)();\n    const comp = actx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=8; comp.attack.value=.002; comp.release.value=.15;\n    master = actx.createGain(); master.gain.value = vol/100*4; master.connect(comp); comp.connect(actx.destination);\n    // 메아리\n    const dl=actx.createDelay(.5); dl.delayTime.value=.13; const fb=actx.createGain(); fb.gain.value=.33; const wet=actx.createGain(); wet.gain.value=.3;\n    echoIn=actx.createGain(); echoIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect( th.max(0,S.earnDay[id]-S.mkt.day)?\"D-\"+Math.max(0,S.earnDay[id]-S.mkt.day):\"오늘!\")],\n      [\"가격제한폭\",\"하루 +100% / −50% (\"+pfmt(rt(o*LIMD))+\" ~ \"+pfmt(rt(o*LIMU))+\")\"]\n    ].map(x=>'\u003cdiv class=\"kv\">\u003cspan>'+x[0]+'\u003c/span>\u003cb>'+x[1]+'\u003c/b>\u003c/div>').join(\"\")+'\u003c/div>'+\n    (peers.length?'\u003cdiv class=\"infoCard\">\u003ch4>🤝 같은 업종 종목\u003c/h4>'+peers.map(x=>'\u003cdiv class=\"peer\" data-id=\"'+x.id+'\">\u003cspan>'+x.ic+'\u003c/span>\u003cb>'+x.n+'\u003c/b>\u003cspan>'+pfmt(S.stkP[x.id])+'\u003c/span>\u003cspan class=\"'+cls(chg(x.id))+'\" style=\"min-width:58px;text-align:right\">'+sgn(chg(x.id))+'\u003c/span>\u003c/div>').join(\"\")+'\u003c/div>':'');\n  $(\"dInfo\").querySelectorAll(\".peer\").forEach(p=>p.onclick=()=>openStk(p.dataset.id));\n  // 내 주식 탭: 거래 내역\n  const lg=S.tlog.filter(t=>t.id===id).slice(0,20);\n  $(\"dLog\").innerHTML='\u003cdiv class=\"infoCard\">\u003ch4>🧾 거래 내역\u003c/h4>'+(lg.length?lg.map(t=>{ const s=Math.floor((Date.now()-t.t)/1000); return '\u003cdiv class=\"tRow\">\u003cspan class=\"'+(t.b?\"up\":\"dn\")+'\">\u003cb>'+(t.b?\"매수\":\"매도\")+'\u003c/b>\u003c/span>\u003cspan>'+fmt(t.q)+'주 @'+pfmt(t.p)+'\u003c/span>\u003cspan style=\"opacity:.6\">'+(s\u003c60?s+\"초 전\":s\u003c3600?Math.floor(s/60)+\"분 전\":Math.floor(s/3600)+\"시간 전\")+'\u003c/span>\u003c/div>'; }).join(\"\"):'\u003cdiv style=\"opacity:.6\">아직 거래한 적이 없어요\u003c/div>')+'\u003c/div>';\n  // 뉴스 탭\n  const nw=S.news.filter(n=>n.id===id||n.text.includes(k.n)).slice(0,15), now=Date.now();\n  $(\"dNews\").innerHTML='\u003cdiv class=\"infoCard\">\u003ch4>📰 '+k.n+' 관련 뉴스\u003c/h4>'+(nw.length?nw.map(n=>{ const s=Math.floor((now-n.t)/1000); return '\u003cdiv class=\"nMini '+(n.dir>0?\"up\":n.dir\u003c0?\"dn\":\"\")+'\">\u003csmall>'+(s\u003c60?s+\"초 전\":Math.floor(s/60)+\"분 전\")+'\u003c/small>'+n.text+'\u003c/div>'; }).join(\"\"):'\u003cdiv style=\"opacity:.6\">아직 관련 뉴스가 없어요\u003c/div>')+'\u003c/div>';\n}\n\n/* ---------- 📈 공용 큰 차트 ---------- */\nfunction lineChart(cv,arr,f){ f=f||pfmt; const W=cv.width=Math.max(300,cv.clientWidth*2), H=cv.height=360, x=cv.getContext(\"2d\"); x.clearRect(0,0,W,H); if(!arr||arr.length\u003c2) return;\n  const mx=Math.max(...arr), mn=Math.min(...arr), rg=Math.max(1e-9,mx-mn), top=24, ch=H-56, R=W-120, X=i=>i/(arr.length-1)*R, Y=v=>top+ch-(v-mn)/rg*ch, up=arr[arr.length-1]>=arr[0], col=up?\"#ff5b5b\":\"#4d9bff\";\n  x.font=\"20px sans-serif\"; x.lineWidth=1; for(let g=0;g\u003c=4;g++){ const y=top+ch*g/4; x.strokeStyle=\"#ffffff14\"; x.beginPath(); x.moveTo(0,y); x.lineTo(R,y); x.stroke(); x.fillStyle=\"#ffffff77\"; x.fillText(f(mx-rg*g/4),R+8,y+7); }\n  x.setLineDash([8,8]); x.strokeStyle=\"#ffffff55\"; x.beginPath(); x.moveTo(0,Y(arr[0])); x.lineTo(R,Y(arr[0])); x.stroke(); x.setLineDash([]);\n  const gr=x.createLinearGradient(0,top,0,top+ch); gr.addColorStop(0,col+\"66\"); gr.addColorStop(1,col+\"00\");\n  x.beginPath(); arr.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v))); x.lineTo(R,top+ch); x.lineTo(0,top+ch); x.closePath(); x.fillStyle=gr; x.fill();\n  x.beginPath(); arr.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v))); x.strokeStyle=col; x.lineWidth=4; x.lineJoin=\"round\"; x.stroke();\n  const hi=arr.indexOf(mx), lo=arr.indexOf(mn); x.fillStyle=\"#ff9b9b\"; x.fillText(\"최고 \"+f(mx),Math.min(X(hi),R-170),Y(mx)-6>16?Y(mx)-6:16); x.fillStyle=\"#9bc4ff\"; x.fillText(\"최저 \"+f(mn),Math.min(X(lo),R-170),Math.min(H-8,Y(mn)+24));\n  x.beginPath(); x.arc(X(arr.length-1),Y(arr[arr.length-1]),7,0,7); x.fillStyle=\"#fff\"; x.fill();\n  x.fillStyle=\"#ffffff66\"; x.fillText(\"과거\",4,H-6); x.fillText(\"지금\",R-44,H-6); }\nconst ago=t=>{ const s=Math.floor((Date.now()-t)/1000); return s\u003c60?s+\"초 전\":s\u003c3600?Math.floor(s/60)+\"분 전\":Math.floor(s/3600)+\"시간 전\"; };\nconst relNews=(f,n=10)=>S.news.filter(f).slice(0,n);\nconst newsHtml=(arr,title)=>'\u003cdiv class=\"infoCard\">\u003ch4>📰 '+title+'\u003c/h4>'+(arr.length?arr.map(n=>'\u003cdiv class=\"nMini ' n), g0=gross-basis, tax=g0>0?g0*.2:0, fee=gross*.005;\n  const free=o.n-o.js, jsSold=Math.max(0,n-free), ret=jsSold?o.dep/o.js*jsSold:0, netv=Math.floor(gross-tax-fee-ret);\n  if(netv\u003c0 && bal()\u003c-netv){ toast(\"💸 전세금을 돌려줄 돈이 부족해요!\"); return; }\n  o.n-=n; o.cost-=basis; if(jsSold){ o.dep-=ret; o.js-=jsSold; } if(!o.n){ o.cost=0; o.dep=0; o.js=0; } if(netv>=0) gain(netv); else spend(-netv); S.stat.reProfit+=netv+ret-basis;\n  toast(r.ic+\" \"+n+\"채 매도 → \"+(netv>=0?\"+\":\"−\")+fmt(Math.abs(netv))+(tax?\" (양도세 −\"+fmt(tax)+\")\":\"\")+(ret?\" (전세금 반환 −\"+fmt(ret)+\")\":\"\")); tone(netv+ret>=basis?1319:300,.12,\"square\",.1); save(); renderRe(); }\nfunction toJeonse(r){ const o=S.re.own[r.id]; if(o.n-o.js\u003c1) return; const d=Math.floor(rePrice(r)*.65); o.js++; o.dep+=d; gain(d); S.stat.jeonse++; toast(\"🔑 \"+r.n+\" 1채를 전세로! 세입자 보증금 +\"+fmt(d)+\" (팔 때 돌려줘야 해요)\"); ping(1300,.12,.2); save(); renderRe(); }\nfunction toWolse(r){ const o=S.re.own[r.id]; if(o.js\u003c1) return; const d=Math.ceil(o.dep/o.js); if(bal()\u003cd){ toast(\"💸 보증금 \"+fmt(d)+\"을 돌려줄 돈이 부족해요\"); return; } spend(d); o.js--; o.dep-=d; toast(\"💵 \"+r.n+\" 1채를 월세로! 보증금 −\"+fmt(d)+\" 반환\"); save(); renderRe(); }\nfunction renderRe(){\n  $(\"rCoins\").textContent=fmt(bal()); const R=S.re; let val=0, rent=0, cost=0, dep=0; RE.forEach(r=>{ const o=R.own[r.id]; val+=o.n*rePrice(r); rent+=(o.n-o.js)*reRent(r); cost+=o.cost; dep+=o.dep; });\n  $(\"reHead\").innerHTML=\"\u003cdiv>🏠 부동산 가치 \u003cb>\"+fmt(val)+\"\u003c/b>\"+(cost?\" \u003csmall class='\"+(val-cost>=0?\"up\":\"dn\")+\"'>(\"+(val-cost>=0?\"+\":\"−\")+fmt(Math.abs(val-cost))+\")\u003c/small>\":\"\")+(dep?\" · 🔑 전세보증금 부채 \u003cb class='warn'>\"+fmt(dep)+\"\u003c/b>\":\"\")+\"\u003c/div>\u003cdiv>💵 월세 \u003cb>+\"+fmt(rent)+\"\u003c/b>/분 · 다음 월세까지 \u003cb>\"+Math.max(0,Math.ceil((R.next-Date.now())/1000))+\"초\u003c/b>\u003c/div>\u003cdiv>누적 월세 \u003cb>\"+fmt(R.rent)+\"\u003c/b> · 🏦 기준금리 \u003cb>\"+S.mkt.br.toFixed(2)+\"%\u003c/b> (금리가 오르면 ,days:5,rate:.13,risk:.05,rk:2,rn:\"위험\"},{id:\"b4\",ic:\"🎲\",n:\"정크본드\",days:4,rate:.32,risk:.18,rk:3,rn:\"매우 위험\"}];\nfunction buyBond(b,f){ const amt=Math.floor(bal()*f); if(amt\u003c100){ toast(\"최소 100코인 이상 필요해요\"); return; } spend(amt); S.bonds.push({id:b.id,amt,mat:S.mkt.day+b.days,rate:b.rate*brMul()}); S.stat.buys++; toast(b.ic+\" \"+b.n+\" \"+fmt(amt)+\" 매입! \"+b.days+\"일 뒤 +\"+(b.rate*brMul()*100).toFixed(1)+\"%\"); ping(1300,.12,.2); save(); renderFin(); }\nfunction bondMature(){ const keep=[]; S.bonds.forEach(x=>{ if(S.mkt.day+1\u003cx.mat){ keep.push(x); return; } const b=BONDS.find(y=>y.id===x.id);\n    if(Math.random()\u003cb.risk){ const back=Math.floor(x.amt*.3); gain(back); S.stat.defaults++; toast(\"💥 \"+b.ic+\" \"+b.n+\" 부도!! 원금의 30%만 돌려받았어요 (+\"+fmt(back)+\")\"); news(\"💥 [채권] \"+b.n+\" 발행 회사 부도 사태\",-1,true); }\n    else { const pay=Math.floor(x.amt*(1+(x.rate||b.rate))); gain(pay); S.stat.bondGain+=pay-x.amt; toast(\"📜 \"+b.ic+\" \"+b.n+\" 만기! +\"+fmt(pay)+\" (이자 +\"+fmt(pay-x.amt)+\")\"); coinCascade(6,50); } });\n  S.bonds=keep; }\nfunction renderBonds(){\n  const box=$(\"bondBox\"); if(!box) return; const hold=S.bonds.reduce((a,b)=>a+b.amt,0);\n  box.innerHTML='\u003cdiv class=\"card2\">'+BONDS.map(b=>'\u003cdiv class=\"bondRow\">\u003cspan class=\"bi\">'+b.ic+'\u003c/span>\u003cspan>\u003cb>'+b.n+'\u003c/b> \u003cspan class=\"risk r'+b.rk+'\">'+b.rn+'\u003c/span>\u003cbr>\u003csmall>'+b.days+'일 만기 · 이자 +'+(b.rate*brMul()*100).toFixed(1)+'% (기준금리 연동) · 부도 확률 '+(b.risk*100)+'%\u003c/small>\u003c/span>\u003cspan class=\"bb\">\u003cbutton data-b=\"'+b.id+'\" data-f=\".1\">10%\u003c/button>\u003cbutton data-b=\"'+b.id+'\" data-f=\".25\">25%\u003c/button>\u003cbutton data-b=\"'+b.id+'\" data-f=\".5\">50%\u003c/button>\u003c/span>\u003c/div>').join(\"\")+\n    '\u003cdiv style=\"margin-top:8px;font-size:.82rem\">\u003cb>📂 보유 채권\u003c/b> (총 '+fmt(hold)+')\u003cbr>'+(S.bonds.length?S.bonds.map(x=>{ const b=BONDS.find(y=>y.id===x.id); return b.ic+\" \"+b.n+\" \"+fmt(x.amt)+\" → \"+Math.max(0,x.mat-S.mkt.day)+\"일 뒤 +\"+fmt(x.amt*(x.rate||b.rate)); }).join(\"\u003cbr>\"):'없어요')+'\u003c/div>\u003cdiv style=\"font-size:.72rem;opacity:.75;margin-top:6px\">💡 하루 = 3분 (주식 장 마감 때 만기 처리) · 이자가 높을수록 부도 위험도 커요\u003c/div>\u003c/div>';\n  box.querySelectorAll(\"button\").forEach(bt=>{ bt.disabled=bal()\u003c100; bt.onclick=()=>buyBond(BONDS.find(b=>b.id===bt.dataset.b),+bt.dataset.f); });\n}\n\n/* ---------- 🏦 기준금리 ---------- */\nconst brMul=()=>S.mkt.br/3.5;\nfunction rateDecision(){\n  if(Math.random()>.18) return; const M=S.mkt; const up=Math.random()\u003c.5+M.reg*.25; const d=Math.random()\u003c.2?.5:.25; const old=M.br;\n  M.br=Math.max(.5,Math.min(8,+(M.br+(up?d:-d)).toFixed(2))); if(M.br===old) return;\n  actStk().forEach(k=>{ if(!k.etf) stkImp[k.id]=(stkImp[k.id]||0)+(up?-.015:.015)*k.b*(d/.25); });\n  if(S.fxD){ stkImp; fxImp.usd=(fxImp.usd||0)+(up?-.01:.01); fxImp.gold=(fxImp.gold||0)+(up?-.01:.01); }\n  news(\"🏦 [중앙은행] 기준금리 \"+d.toFixed(2)+\"%p \"+(up?\"인상 ⬆\":\"인하 ⬇\")+\" → \"+M.br.toFixed(2)+\"% (\"+(up?\"예금·대출 이자 ↑, 주식 부담\":\"예금·대출 이자 ↓, 주식 호재\")+\")\",up?-1:1,true);\n  toast(\"🏦 기준금리 \"+(up?\"인상\":\"인하\")+\"! 지금 \"+M.br.toFixed(2)+\"%\");\n}\n\n/* ---------- 🪙 코인 거래소 ---------- */\nconst CRY=[\n  {id:\"btc\",ic:\"🟠\",n:\"비트골드\",p:8e7,v:.010,d:\"코인계의 금 · 가장 크고 그나마 안정적이에요\"},\n  {id:\"eth\",ic:\"🔷\",n:\"이더번개\",p:4e6,v:.014,d:\"앱을 올릴 수 있는 플랫폼 코인이에요\"},\n  {id:\"sol\",ic:\"🌞\",n:\"솔라썬\",p:2e5,v:.02,d:\"빠른 속도가 장점인 신흥 코인이에요\"},\n  {id:\"dog\",ic:\"🐕\",n:\"도지멍멍\",p:150,v:.032,meme:1,d:\"장난으로 만든 밈코인 · 유명인 말 한마디에 폭등·폭락\"},\n  {id:\"frg\",ic:\"🐸\",n:\"개굴코인\",p:2,v:.05,meme:1,d:\"초고위험 밈코인 · 하루아침에 휴지조각이 될 수도\"},\n  {id:\"usdt\",ic:\"💲\",n:\"스테이블달러\",p:1350,v:0,stable:1,d:\"달러 가격에 맞춰 움직이는 코인 · 안전하게 잠시 대피할 때 써요\"},\n];\nconst CRY_FEE=.001;\nfunction initCry(){ if(!S.cry) S.cry={}; const C=S.cry; C.p=C.p||{}; C.a=C.a||{}; C.h=C.h||{}; C.own=C.own||{};\n  CRY.forEach(x=>{ if(!C.p[x.id]) C.p[x.id]=x.p; if(!C.a[x.id]) C.a[x.id]=x.p; if(!Array.isArray(C.h[x.id])||!C.h[x.id].length) C.h[x.id]=[C.p[x.id]]; if(!C.own[x.id]) C.own[x.id]={n:0,cost:0}; }); }\nconst cryValue=()=>S.cry?CRY.reduce((a,x)=>a+S.cry.own[x.id].n*S.cry.p[x.id],0):0;\nconst qfmt=q=>q>=1000?fmt(Math.floor(q)):(+q.toFixed(q\u003c1?6:3)).toLocaleString(\"ko-KR\");\nfunction cryTick(){ const C=S.cry, g=gauss();\n  CRY.forEach(x=>{ if(x.stable){ C.p[x.id]=fxP(\"usd\"); } else { const P=C.p[x.id], A=C.a[x.id]; C.a[x.id]=A*Math.exp(.0001+gauss()*.004+S.mkt.reg*.0003); C.p[x.id]=Math.max(x.p*1e-6,P*Math.exp(x.v*(gauss()*.8+g*.6)-.004*Math.log(P/A))); }\n    const H=C.h[x.id]; H.push(C.p[x.id]); if(H.length>90) H.shift(); });\n  if(Math.random()\u003c.035){ const r=Math.random(), pick=()=>CRY.filter(x=>!x.stable)[rnd(5)];\n    if(r\u003c.25){ const x=CRY.filter(y=>y.meme)[rnd(2)], m=.3+Math.random()*1.5; C.p[x.id]*=1+m; C.a[x.id]*=1+m*.5; news(\"🚀 [코인] 유명인 SNS에 \"+x.ic+\" \"+x.n+\" 언급! 펌핑 +\"+(m*100).toFixed(0)+\"%\",1,true); }\n    else if(r\u003c.45){ const x=pick(), m=.15+Math.random()*.3; C.p[x.id]*=1-m; news(\"📉 [코인] \"+x.ic+\" \"+x.n+\" 고래 대량 매도! −\"+(m*100).toFixed(0)+\"%\",-1,m>.25); }\n    else if(r\u003c.55){ CRY.forEach(x=>{ if(!x.stable) C.p[x.id]*=.82; }); news(\"🏴‍☠️ [코인] 거래소 해킹 사건! 코인 시장 전체 급락 −18%\",-1,true); }\n    else if(r\u003c.65){ C.p.btc*=1.15; C.a.btc*=1.1; C.p.eth*=1.1; news(\"🏛️ [코인] 비트골드 ETF 승인! 기관 자금 유입 +15%\",1,true); }\n    else if(r\u003c.75){ CRY.forEach(x=>{ if(!x.stable) C.p[x.id]*=.9; }); news(\"⚖️ [코인] 정부, 코인 규제 강화 발표… −10%\",-1,true); }\n    else if(r\u003c.8){ const x=CRY.filter(y=>y.meme)[rnd(2)], o=C.own[x.id]; C.p[x.id]*=.04; C.a[x.id]=C.p[x.id]; news(\"🧶 [코인] \"+x.ic+\" \"+x.n+\" 개발자 잠적, 러그풀!! −96%\",-1,true); if(o.n) toast(\"😱 \"+x.n+\" 러그풀… 내 코인이 휴지조각이 됐어요\"); }\n    else { const x=pick(), m=.08+Math.random()*.2; C.p[x.id]*=1+m; news(\"📈 [코인] \"+x.ic+\" \"+x.n+\" 대형 거래소 상장! +\"+(m*100).toFixed(0)+\"%\",1,false); } }\n  if(curView===\"cry\" && !ptrDown) renderCry(); }\nfunction cryBuy( [2]+\" (\"+(e[1]>0?\"▲\":\"▼\")+(m*100).toFixed(1)+\"%)\",e[1],m>.05); }\n  if(curView===\"fx\" && !ptrDown) renderFx();\n}\nfunction fxBuy(x,f){ const P=fxP(x.id)*(1+x.sp/2); const q=Math.floor(bal()*f/P); if(q\u003c1){ toast(\"코인이 부족해요 (1\"+x.u.replace(/^1/,\"\")+\" \"+fmt(P)+\")\"); return; } const c=Math.ceil(q*P); spend(c); const o=S.fx.own[x.id]; o.n+=q; o.cost+=c; S.stat.fxTrades++; toast(x.ic+\" \"+x.n+\" \"+fmt(q)+\"개 매수 (−\"+fmt(c)+\")\"); tone(880,.06,\"square\",.1); save(); renderFx(); }\nfunction fxSell(x,f){ const o=S.fx.own[x.id]; const q=f>=1?o.n:Math.floor(o.n*f); if(q\u003c1) return; const P=fxP(x.id)*(1-x.sp/2), g=Math.floor(q*P), basis=o.cost*(q/o.n); o.n-=q; o.cost-=basis; if(!o.n) o.cost=0; gain(g); S.stat.fxTrades++; S.stat.fxProfit+=g-basis; toast(x.ic+\" \"+fmt(q)+\"개 매도 → \"+(g-basis>=0?\"💹 +\":\"📉 −\")+fmt(Math.abs(g-basis))); tone(g>=basis?1319:300,.1,\"square\",.1); save(); renderFx(); }\nfunction fxValue(){ return S.fx?FXL.reduce((a,x)=>a+S.fx.own[x.id].n*fxP(x.id),0):0; }\nfunction renderFx(){\n  $(\"xCoins\").textContent=fmt(bal()); let v=0,c=0; FXL.forEach(x=>{ const o=S.fx.own[x.id]; v+=o.n*fxP(x.id); c+=o.cost; });\n  $(\"fxHead\").innerHTML=\"\u003cdiv>🌍 보유 평가 \u003cb>\"+fmt(v)+\"\u003c/b>\"+(c?\" \u003csmall class='\"+cls(v-c)+\"'>(\"+(v-c>=0?\"+\":\"−\")+fmt(Math.abs(v-c))+\")\u003c/small>\":\"\")+\"\u003c/div>\u003cdiv>💵 환율 \u003cb>\"+fmt(fxP(\"usd\"))+\"\u003c/b>원/달러 · 🥇 금 \u003cb>\"+fmt(fxP(\"gold\"))+\"\u003c/b>/g\u003c/div>\";\n  const card=x=>{ const o=S.fx.own[x.id], P=fxP(x.id), H=S.fx.h[x.id], ch=(H[H.length-1]/H[0]-1)*100, pl=o.n?o.n*P-o.cost:0;\n    return '\u003cdiv class=\"fxC\" data-id=\"'+x.id+'\">\u003cdiv class=\"top\">\u003cspan class=\"fi\">'+x.ic+'\u003c/span>\u003cdiv class=\"nm\">\u003cb>'+x.n+'\u003c/b>\u003cbr>\u003csmall>'+x.u+' 기준 · 수수료 '+(x.sp*50).toFixed(1)+'%\u003c/small>\u003c/div>\u003cdiv class=\"pr\">\u003cb>'+pfmt(P)+'\u003c/b>\u003cbr>\u003cspan class=\"'+cls(ch)+'\">'+sgn(ch)+'\u003c/span>\u00 =\"luxHead\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"fameBox\" class=\"fameBox\">\u003c/div>\n  \u003cdiv id=\"luxGrid\" class=\"luxGrid\">\u003c/div>\n  \u003cdiv class=\"wNote\">💎 살 때 사치세 20% · 팔 때 중고 수수료 10% · 유지비는 1분마다 나가요 · 시계·와인·그림·섬은 값이 오르내리고, 차·요트·비행기는 갈수록 값이 떨어져요\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"fxView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"xCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\" id=\"fxHead\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"fxGrid\" class=\"reGrid\">\u003c/div>\u003cdiv id=\"fxDet\" class=\"detPage\" style=\"display:none\">\u003c/div>\n  \u003cdiv class=\"wNote\">🌍 3초마다 가격이 변해요 · 살 때·팔 때 수수료가 있어요 · 불황엔 금·달러·엔화(안전자산)가 오르고, 호황엔 원자재가 올라요\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"finView\" class=\"xView\">\n  \u003cdiv class=\"wHead\">\u003cdiv class=\"wCoins\">💰 \u003cb id=\"fCoins\">0\u003c/b>\u003c/div>\u003cdiv class=\"wStats\" id=\"finHead\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"xTitle\">🏆 부자 순위 \u003csmall>(NPC + 등록한 친구들 · 순자산 = 현금 + 예금 + 주식 + 부동산 + 채권 + 도시 + 컬렉션 + 회사 + 명품 + 코인 − 빚)\u003c/small>\u003c/div>\n  \u003cdiv id=\"rankBox\" class=\"rankBox\">\u003c/div>\n  \u003cdiv class=\"xTitle\">🌐 친구들과 같이 순위 겨루기 \u003csmall>(이름만 적고 등록하면 위 부자 순위에 친구들과 함께 나와요)\u003c/small>\u003c/div>\n  \u003cdiv class=\"frBox\">\n    \u003cdiv id=\"frMyRank\" class=\"frMyRank\">\u003c/div>\n    \u003cdiv id=\"frErr\">\u003c/div>\n    \u003cdiv class=\"frIn\">\n      \u003clabel>✏️ 내 이름 \u003cinput id=\"frNick\" maxlength=\"12\" placeholder=\"예: 민준\">\u003c/label>\n      \u003cdiv class=\"frBtns\">\u003cbutton id=\"frReg\">🏆 랭킹에 등록\u003c/button>\u003cbutton id=\"frRef\">🔄 새로고침\u003c/button>\u003c/div>\n      \u003cbutton id=\"frOut\" style=\"display:none\">🚪 랭킹에서 나가기\u003c/button>\n    \u003c/div>\n    \u003csmall style=\"opacity:.75\">💡 등록하면 게임을 켜 둔 동안 내 순자산이 20초마다 자동으로 올라가요. 랭킹을 볼 때만 인터넷이 필요해요.\u003c/small>\n  \u003c/div>\n  \n  \u003cdiv class=\"xTitle\">📊 내 자산 구성\u003c/div>\n  \u003cdiv id=\"assetBox\" class=\"assetBox\">\u003c/div>\n  \u003cdiv class=\"xTitle\">💸 현금 흐름 · 가계부 \u003csmall>(1분마다 들어오고 나가는 돈)\u003c/small>\u003c/div>\n  \u003cdiv id=\"cfBox\" class=\"loanBox\">\u003c/div>\n  \u003cdiv class=\"xTitle\">💳 대출 \u003csmall>(빚도 자산이다? 이자는 1분마다 불어나요!)\u003c/small>\u003c/div>\n  \u003cdiv id=\"loanBox\" class=\"loanBox\">\u003c/div>\n  \u003cdiv class=\"xTitle\">📜 채권 \u003csmall>(돈을 빌려주고 만기에 이자를 받아요 · 위험할수록 이자가 높아요)\u003c/small>\u003c/div>\n  \u003cdiv id=\"bondBox\" class=\"loanBox\">\u003c/div>\n\u003c/div>\n\n\u003c!-- 배당표 -->\n\u003cdiv class=\"overlay\" id=\"payModal\">\u003cdiv class=\"paybox\">\n  \u003ch2>📊 배당표 &amp; 확률\u003c/h2>\n  \u003ctable id=\"payTable\">\u003c/table>\n  \u003cdiv class=\"note\" id=\"payNote\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"payClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003c!-- 상점 -->\n\u003cdiv class=\"overlay\" id=\"shopModal\">\u003cdiv class=\"paybox shopBox\">\n  \u003cdiv class=\"shopHead\">\u003ch2>🛍️ 상점\u003c/h2>\u003cdiv class=\"shopTop\">💰 \u003cb id=\"shopCoins\">0\u003c/b>\u003c/div>\u003c/div>\n  \u003cdiv class=\"shopTabs\" id=\"shopTabs\">\u003c/div>\n  \u003cdiv class=\"rerollRow\" id=\"rerollRow\">\u003cspan>🔥 오늘의 특가! 할인율은 랜덤이에요. 새로고침하면 다시 뽑아요.\u003cbr>\u003csmall style=\"opacity:.8\">🛡️ 슬롯 아이템은 베팅이 \u003cb id=\"shopCap\">\u003c/b> 이하일 때만 효과가 있어요\u003c/small>\u003c/span>\u003cbutton class=\"shopBtn2\" id=\"rerollBtn\">🔄 30코인\u003c/button>\u003c/div>\n  \u003cdiv id=\"offers\" class=\"igrid\">\u003c/div>\n  \u003cdiv id=\"boxPanel\">\n    \u003cdiv class=\"boxCard\">\n      \u003cdiv id=\"boxIcon\">🎁\u003c/div>\n      \u003cdiv id=\"boxResult\">뭐가 나올지는 운에 달렸어요!\u003c/div>\n      \u003cdiv class=\"boxBtns\">\u003cbutton class=\"shopBtn2\" id=\"boxBtn\">일반 박스 · 250\u003c/button>\u003cbutton class=\"shopBtn2 prem\" id=\"boxBtn2\">프리미엄 박스 · 2,000\u003c/button>\u003c/div>\n      \u003cdiv class=\"odds\">\n        \u003cb>일반\u003c/b> \u003cspan class=\"r-common\">일반 7 lass=\"shopHead\">\u003ch2>📅 일일 보상\u003c/h2>\u003cdiv class=\"shopTop\" id=\"daySum\">\u003c/div>\u003c/div>\n  \u003ch3 class=\"secH\">📅 출석 체크 \u003csmall id=\"attInfo\">\u003c/small>\u003c/h3>\n  \u003cdiv id=\"attGrid\">\u003c/div>\n  \u003cbutton class=\"shopBtn2\" id=\"attBtn\" style=\"width:100%;margin:8px 0\">오늘 출석하기\u003c/button>\n  \u003ch3 class=\"secH\">📝 오늘의 퀘스트 \u003csmall>(매일 자정에 새로 바뀌어요)\u003c/small>\u003c/h3>\n  \u003cdiv id=\"questList\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"dayClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003c!-- 통계 -->\n\u003cdiv class=\"overlay\" id=\"statModal\">\u003cdiv class=\"paybox shopBox\">\n  \u003cdiv class=\"shopHead\">\u003ch2>📊 통계 & 도감\u003c/h2>\u003c/div>\n  \u003cdiv id=\"statGrid\">\u003c/div>\n  \u003ch3 class=\"secH\">📈 최근 코인 추이\u003c/h3>\n  \u003cdiv id=\"curveBox\">\u003c/div>\n  \u003ch3 class=\"secH\">🃏 도감 \u003csmall>(그림별 일치 기록)\u003c/small>\u003c/h3>\n  \u003cdiv id=\"colGrid\">\u003c/div>\n  \u003cbutton class=\"closeBtn\" id=\"statClose\">닫기\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003c!-- 설정 -->\n\u003cdiv class=\"overlay\" id=\"setModal\">\u003cdiv class=\"paybox shopBox\" style=\"max-width:520px !important\">\n  \u003cdiv class=\"shopHead\">\u003ch2>⚙️ 설정\u003c/h2>\u003c/div>\n  \u003clabel class=\"setRow\">\u003cspan>🎵 배경음악 \u003csmall>(8비트 BGM)\u003c/small>\u003c/span>\u003cinput type=\"checkbox\" id=\"setBgm\">\u003c/label>\n  \u003clabel class=\"setRow\">\u003cspan>⚡ 이펙트 줄이기 \u003csmall>(컴퓨터가 느릴 때 켜요)\u003c/small>\u003c/span>\u003cinput type=\"checkbox\" id=\"setLow\">\u003c/label>\n  \u003clabel class=\"setRow\">\u003cspan>📳 화면 흔들림 끄기\u003c/span>\u003cinput type=\"checkbox\" id=\"setShake\">\u003c/label>\n  \u003ch3 class=\"secH\">💾 저장 코드 \u003csmall>(다른 컴퓨터로 옮길 때)\u003c/small>\u003c/h3>\n  \u003ctextarea id=\"saveBox\" rows=\"3\" placeholder=\"여기에 저장 코드가 나와요 / 붙여넣어서 불러와요\" spellcheck=\"false\">\u003c/textarea>\n  \u003cdiv class=\"boxBtns\">\u003cbutton class=\"shopBtn2\" bet = 10, busy = false, shown = START;\nvar wiped=false;\nfunction save(){ if(wiped) return; try{ localStorage.setItem(\"jp777\", JSON.stringify({coins,best,charm:S.charm,amp:S.amp,potion:S.potion,ins:S.ins,free:S.free,jb:S.jb,dbl:S.dbl,glove:S.glove,batt:S.batt,clv:S.clv,cd:S.cd,skins:S.skins,skin:S.skin,rb:S.rb,soul:S.soul,run:S.run,perk:S.perk,lc:S.lc,la:S.la,clicks:S.clicks,bonusAt:S.bonusAt,S:S,ts:Date.now()})); }catch(e){} }\nvar migMsg=0;\nfunction load(){\n  try{ const d=JSON.parse(localStorage.getItem(\"jp777\")||\"null\");\n    if(d && typeof d.coins===\"number\"){ if(d.S) mergeS(d.S); coins=d.coins; best=Math.max(d.best||0,coins); S.charm=d.charm|0; S.amp=d.amp|0; S.potion=d.potion|0; S.ins=d.ins|0; S.free=d.free|0; S.jb=d.jb|0; S.dbl=d.dbl|0; S.glove=d.glove|0; S.batt=d.batt|0; S.clv=d.clv|0; S.cd=d.cd|0; if(d.skins) Object.assign(S.skins,d.skins); if(d.skin&&S.skins[d.skin]) S.skin=d.skin; S.rb=d.rb|0; S.soul=d.soul|0; S.run=d.run||0; if(d.perk) Object.assign(S.perk,d.perk);\n      S.lc=d.lc|0; S.la=d.la|0; S.clicks=d.clicks|0; S.bonusAt=d.bonusAt||0;\n      if(!S.car.mig){ S.car.mig=true; const sev=Math.round((15*Math.pow(1.32,S.lc)+25*Math.pow(1.34,S.la))*1.5); if(S.lc+S.la>0){ coins+=sev; migMsg=sev; } S.lc=0; S.la=0; }\n      const el=Math.min((Date.now()-(d.ts||Date.now()))/1000,7200+3600*S.offL); if(el>30){ const parts={auto:Math.floor(clickPay()*el*.5),city:Math.floor(cityRate()*el),robo:0,bank:Math.floor(S.bank.dep*(0.008+0.002*S.bank.rate)*el/60)}; offlineGain=parts.auto+parts.city+parts.robo+parts.bank; if(offlineGain>0){ offlineInfo={el,parts}; coins+=offlineGain; best=Math.max(best,coins); S.stat.interest+=parts.bank; } }\n      shown=coins; }\n  }catch(e){}\n}\n\n/* ---------- 확률 / 배당 (업그레이드 반영) ---------- */\nfunction luck(){ return 0.06*S.charm + (itemsOn&&S.potion>0 ? 0.5 : 0) + (itemsOn&&S.sluck>0 ? 1.5 : 0) + 0.03*S.perk.slot + bonusLuck(); }\nfunction effW(){ const ew=W.map((w,i)=> i>=2 ? w*(1+luck()) : w); if(itemsOn&&S.jb>0) ew[5]*=2; return ew; }\nfunction payBonus(){ return (1 + 0.03*S.amp)*(1+bonusSlot()); }\nfunction pick(ew){ const tot=ew.reduce((a,b)=>a+b); let r=Math.random()*tot; for(let i=0;i\u003cew.length;i++){ if((r-=ew[i])\u003c0) return i; } return 0; }\n\n/* ---------- 소리 (아케이드 / 8비트 스타일) ---------- */\nlet actx, master, echoIn, noiseBuf, vol = 80;\ntry{ const v=localStorage.getItem(\"jp777vol\"); if(v!==null) vol=+v; }catch(e){}\nfunction ac(){\n  if(!actx){\n    actx = new (window.AudioContext||window.webkitAudioContext)();\n    const comp = actx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=8; comp.attack.value=.002; comp.release.value=.15;\n    master = actx.createGain(); master.gain.value = vol/100*4; master.connect(comp); comp.connect(actx.destination);\n    // 메아리\n    const dl=actx.createDelay(.5); dl.delayTime.value=.13; const fb=actx.createGain(); fb.gain.value=.33; const wet=actx.createGain(); wet.gain.value=.3;\n    echoIn=actx.createGain(); echoIn.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);\n    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);\n    const d = noiseBuf.getChannelData(0); for(let i=0;i\u003cd.length;i++) d[i]=Math.random()*2-1;\n  }\n  if(actx.state===\"suspended\") actx.resume();\n  return actx;\n}\n// 기본 음 (사각파/삼각파) + 피치 슬라이드\nfunction tone(f,d,type=\"square\",v=.1,slideTo=0,echo=false){\n  try{ const a=ac(),t=a.currentTime; const o=a.createOscillator(),g=a.createGain();\n    o.type=type; o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+d);\n    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+.003); g.gain.setValueAtTime(v,t+d*.55); g.gain.exponentialRampToValueAtTime(.0001,t+d);\n    o.connect(g); g.connect(master); if(echo) g.connect(echoIn); o.start(t); o.stop(t+d+.03); }catch(e){} }\nfunction noiseBurst(v=.3,f=1500,d=.08,q=.8){ try{ const a=ac(),t=a.currentTime; const s=a.createBufferSource(); s.buffe isabled\")+'>💵 1채 월세로\u003c/button>':'')+'\u003c/div>\u003c/div>'+\n    '\u003cdiv class=\"infoCard\">\u003ch4>🏘️ 이 동네는요\u003c/h4>'+(RDESC[r.id]||\"\")+'\u003c/div>'+newsHtml(relNews(n=>n.text.includes(\"[부동산] \"+r.reg)),r.reg+\" 부동산 뉴스\");\n  $(\"reDB\").querySelectorAll(\"button\").forEach(b=>b.onclick=()=>{ const a=b.dataset.a; if(a===\"b1\") buyRe(r,1); else if(a===\"bm\") buyRe(r,\"max\"); else if(a===\"s1\") sellRe(r,1); else if(a===\"sm\") sellRe(r,\"max\"); else if(a===\"js\") toJeonse(r); else toWolse(r); });\n}\n\n/* ---------- 📜 채권 ---------- */\nconst BONDS=[{id:\"b1\",ic:\"🇰🇷\",n:\"국채\",days:3,rate:.03,risk:0,rk:0,rn:\"안전\"},{id:\"b2\",ic:\"🏦\",n:\"은행채\",days:4,rate:.06,risk:.01,rk:1,rn:\"조금 위험\"},{id:\"b3\",ic:\"🏭\",n:\"회사채\",days:5,rate:.13,risk:.05,rk:2,rn:\"위험\"},{id:\"b4\",ic:\"🎲\",n:\"정크본드\",days:4,rate:.32,risk:.18,rk:3,rn:\"매우 위험\"}];\nfunction buyBond(b,f){ const amt=Math.floor(bal()*f); if(amt\u003c100){ toast(\"최소 100코인 이상 필요해요\"); return; } spend(amt); S.bonds.push({id:b.id,amt,mat:S.mkt.day+b.days,rate:b.rate*brMul()}); S.stat.buys++; toast(b.ic+\" \"+b.n+\" \"+fmt(amt)+\" 매입! \"+b.days+\"일 뒤 +\"+(b.rate*brMul()*100).toFixed(1)+\"%\"); ping(1300,.12,.2); save(); renderFin(); }\nfunction bondMature(){ const keep=[]; S.bonds.forEach(x=>{ if(S.mkt.day+1\u003cx.mat){ keep.push(x); return; } const b=BONDS.find(y=>y.id===x.id);\n    if(Math.random()\u003cb.risk){ const back=Math.floor(x.amt*.3); gain(back); S.stat.defaults++; toast(\"💥 \"+b.ic+\" \"+b.n+\" 부도!! 원금의 30%만 돌려받았어요 (+\"+fmt(back)+\")\"); news(\"💥 [채권] \"+b.n+\" 발행 회사 부도 사태\",-1,true); }\n    else { const pay=Math.floor(x.amt*(1+(x.rate||b.rate))); gain(pay); S.stat.bondGain+=pay-x.amt; toast(\"📜 \"+b.ic+\" \"+b.n+\" 만기! +\"+fmt(pay)+\" (이자 +\"+fmt(pay-x.amt)+\")\"); coinCascade(6,50); } });\n  S.bonds=keep; }\nfunction renderBonds(){\n  const box=$(\"bondBox\"); if(!box) return; const hold=S.bonds.reduce((a,b)=>a+b.amt,0);\n  box.innerHTML='\u003cdiv class=\"card2\">'+BONDS.map(b=>'\u003cdiv class=\"bondRow\">\u003cspan class=\"bi\">'+b.ic+'\u003c/span>\u003cspan>\u003cb>'+b.n+'\u003c/b> \u003cspan class=\"risk r'+b.rk+'\">'+b.rn+'\u003c/span>\u003cbr>\u003csmall>'+b.days+'일 만기 · 이자 +'+(b.rate*brMul()*100).toFixed(1)+'% (기준금리 연동) · 부도 확률 '+(b.risk*100)+'%\u003c/small>\u003c/span>\u003cspan class=\"bb\">\u003cbutton data-b=\"'+b.id+'\" data-f=\".1\">10%\u003c/button>\u003cbutton data-b=\"'+b.id+'\" data-f=\".25\">25%\u003c/button>\u003cbutton data-b=\"'+b.id+'\" data-f=\".5\">50%\u003c/button>\u003c/span>\u003c/div>').join(\"\")+\n    '\u003cdiv style=\"margin-top:8px;font-size:.82rem\">\u003cb>📂 보유 채권\u003c/b> (총 '+fmt(hold)+')\u003cbr>'+(S.bonds.length?S.bonds.map(x=>{ const b=BONDS.find(y=>y.id===x.id); return b.ic+\" \"+b.n+\" \"+fmt(x.amt)+\" → \"+Math.max(0,x.mat-S.mkt.day)+\"일 뒤 +\"+fmt(x.amt*(x.rate||b.rate)); }).join(\"\u003cbr>\"):'없어요')+'\u003c/div>\u003cdiv style=\"font-size:.72rem;opacity:.75;margin-top:6px\">💡 하루 = 3분 (주식 장 마감 때 만기 처리) · 이자가 높을수록 부도 위험도 커요\u003c/div>\u003c/div>';\n  box.querySelectorAll(\"button\").forEach(bt=>{ bt.disabled=bal()\u003c100; bt.onclick=()=>buyBond(BONDS.find(b=>b.id===bt.dataset.b),+bt.dataset.f); });\n}\n\n/* ---------- 🏦 기준금리 ---------- */\nconst brMul=()=>S.mkt.br/3.5;\nfunction rateDecision(){\n  if(Math.random()>.18) return; const M=S.mkt; const up=Math.random()\u003c.5+M.reg*.25; const d=Math.random()\u003c.2?.5:.25; const old=M.br;\n  M.br=Math.max(.5,Math.min(8,+(M.br+(up?d:-d)).toFixed(2))); if(M.br===old) return;\n  actStk().forEach(k=>{ if(!k.etf) stkImp[k.id]=(stkImp[k.id]||0)+(up?-.015:.015)*k.b*(d/.25); });\n  if(S.fxD){ stkImp; fxImp.usd=(fxImp.usd||0)+(up?-.01:.01); fxImp.gold=(fxImp.gold||0)+(up?-.01:.01); }\n  news(\"🏦 [중앙은행] 기준금리 \"+d.toFixed(2)+\"%p \"+(up?\"인상 ⬆\":\"인하 ⬇\")+\" → \"+M.br.toFixed(2)+\"% (\"+(up?\"예금·대출 이자 ↑, 주식 부담\":\"예금·대출 이자 ↓, 주식 호재\")+\")\",up?-1:1,true);\n  toast(\"🏦 기준금리 \"+(up?\"인상\":\"인하\")+\"! 지금 \"+M.br.toFixed(2)+\"%\");\n}\n\n/* ---------- 🪙 코인 거래소 ---------- */\nconst CRY=[\n  {id:\"btc\",ic:\"🟠\",n:\"비트골드\",p:8e7,v:.010,d:\"코인계의 금 · 가장 크고 그나마 안정적이에요\"},\n  {id:\"eth\",ic:\"🔷\",n:\"이더번개\",p:4e6,v:.014,d:\"앱을 올릴 수 있는 플랫폼 코인이에요\"},\n  {id:\"sol\",ic:\"🌞\",n:\"솔라썬\",p:2e5,v:.02,d:\"빠른 속도가 장점인 신흥 코인이에요\"},\n  {id:\"dog\",ic:\"🐕\",n:\"도지멍멍\",p:150,v:.032,meme:1,d:\"장난으로 만든 밈코인 · 유명인 말 한마디에 폭등·폭락\"},\n  {id:\"frg\",ic:\"🐸\",n:\"개굴코인\",p:2,v:.05,meme:1,d:\"초고위험 밈코인 · 하루아침에 휴지조각이 될 수도\"},\n  {id:\"usdt\",ic:\"💲\",n:\"스테이블달러\",p:1350,v:0,stable:1,d:\"달러 가격에 맞춰 움직이는 코인 · 안전하게 잠시 대피할 때 써요\"},\n];\nconst CRY_FEE=.001;\nfunction initCry(){ if(!S.cry) S.cry={}; const C=S.cry; C.p=C.p||{}; C.a=C.a||{}; C.h=C.h||{}; C.own=C.own||{};\n  CRY.forEach(x=>{ if(!C.p[x.id]) C.p[x.id]=x.p; if(!C.a[x.id]) C.a[x.id]=x.p; if(!Array.isArray(C.h[x.id])||!C.h[x.id].length) C.h[x.id]=[C.p[x.id]]; if(!C.own[x.id]) C.own[x.id]={n:0,cost:0}; }); }\nconst cryValue=()=>S.cry?CRY.reduce((a,x)=>a+S.cry.own[x.id].n*S.cry.p[x.id],0):0;\nconst qfmt=q=>q>=1000?fmt(Math.floor(q)):(+q.toFixed(q\u003c1?6:3)).toLocaleString(\"ko-KR\");\nfunction cryTick(){ const C=S.cry, g=gauss();\n  CRY.forEach(x=>{ if(x.stable){ C.p[x.id]=fxP(\"usd\"); } else { const P=C.p[x.id], A=C.a[x.id]; C.a[x.id]=A*Math.exp(.0001+gauss()*.004+S.mkt.reg*.0003); C.p[x.id]=Math.max(x.p*1e-6,P*Math.exp(x.v*(gauss()*.8+g*.6)-.004*Math.log(P/A))); }\n    const H=C.h[x.id]; H.push(C.p[x.id]); if(H.length>90) H.shift(); });\n  if(Math.random()\u003c.035){ const r=Math.random(), pick=()=>CRY.filter(x=>!x.stable)[rnd(5)];\n    if(r\u003c.25){ const x=CRY.filter(y=>y.meme)[rnd(2)], m=.3+Math.random()*1.5; C.p[x.id]*=1+m; C.a[x.id]*=1+m*.5; news(\"🚀 [코인] 유명인 SNS에 \"+x.ic+\" \"+x.n+\" 언급! 펌핑 +\"+(m*100).toFixed(0)+\"%\",1,true); }\n    else if(r\u003c.45){ const x=pick(), m=.15+Math.random()*.3; C.p[x.id]*=1-m; news(\"📉 [코인] \"+x.ic+\" \"+x.n+\" 고래 대량 매도! −\"+(m*100).toFixed(0)+\"%\",-1,m>.25); }\n    else if(r\u003c.55){ CRY.forEach(x=>{ if(!x.stable) C.p[x.id]*=.82; }); news(\"🏴‍☠️ [코인] 거래소 해킹 사건! 코인 시장 전체 급락 −18%\",-1,true); }\n    else if(r\u003c.65){ C.p.btc*=1.15; C.a.btc*=1.1; C.p.eth*=1.1; news(\"🏛️ [코인] 비트골드 ETF 승인! 기관 자금 유입 +15%\",1,true); }\n    else if(r\u003c.75){ CRY.forEach(x=>{ if(!x.stable) C.p[x.id]*=.9; }); news(\"⚖️ [코인] 정부, 코인 규제 강화 발표… −10%\",-1,true); }\n    else if(r\u003c.8){ const x=CRY.filter(y=>y.meme)[rnd(2)], o=C.own[x.id]; C.p[x.id]*=.04; C.a[x.id]=C.p[x.id]; news(\"🧶 [코인] \"+x.ic+\" \"+x.n+\" 개발자 잠적, 러그풀!! −96%\",-1,true); if(o.n) toast(\"😱 \"+x.n+\" 러그풀… 내 코인이 휴지조각이 됐어요\"); }\n    else { const x=pick(), m=.08+Math.random()*.2; C.p[x.id]*=1+m; news(\"📈 [코인] \"+x.ic+\" \"+x.n+\" 대형 거래소 상장! +\"+(m*100).toFixed(0)+\"%\",1,false); } }\n  if(curView===\"cry\" && !ptrDown) renderCry(); }\nfunction cryBuy(x,f){ const P=S.cry.p[x.id], amt=Math.floor(bal()*f); if(amt\u003c1){ toast(\"코인이 부족해요\"); return; } const q=amt*(1-CRY_FEE)/P; spend(amt); const o=S.cry.own[x.id]; o.n+=q; o.cost+=amt; S.stat.cryTrades=(S.stat.cryTrades||0)+1;\n  toast(x.ic+\" \"+x.n+\" \"+qfmt(q)+\"개 매수 (−\"+fmt(amt)+\")\"); tone(880,.06,\"square\",.1); save(); renderCry(); }\nfunction crySell(x,f){ const o=S.cry.own[x.id]; if(o.n\u003c=0) return; const q=f>=1?o.n:o.n*f, P=S.cry.p[x.id], g=Math.floor(q*P*(1-CRY_FEE)), basis=o.cost*(q/o.n); o.n-=q; o.cost-=basis; if(o.n\u003c1e-9){ o.n=0; o.cost=0; } gain(g); S.stat.cryTrades=(S.stat.cryTrades||0)+1; S.stat.cryProfit=(S.stat.cryProfit||0)+g-basis;\n  toast(x.ic+\" \"+qfmt(q)+\"개 매도 → +\"+fmt(g)+\" (\"+(g-basis>=0?\"💹 +\":\"📉 −\")+fmt(Math.abs(g-basis))+\")\"); tone(g>=basis?1319:300,.12,\"square\",.1); if(g-basis>0) coinCascade(5,50); save(); renderCry(); }\nfunction renderCry(){ $(\"yCoins\").textContent=fmt(bal()); const C=S.cry; let v=0,c=0; CRY.forEach(x=>{ v+=C.own[x.id].n*C.p[x.id]; c+=C.own[x.id].cost; });\n  $(\"cryHead\").innerHTML=\"\u003cdiv>🪙 코인 평가 \u003cb>\"+fmt(v)+\"\u003c/b>\"+(c?\" \u003csmall class='\"+cls(v-c)+\"'>(\"+(v-c>=0?\"+\":\"−\")+fmt(Math.abs(v-c))+\")\u003c/small>\":\"\")+\"\u003c/div>\u003cdiv>💹 실현손익 \u003cb class='\"+cls(S.stat.cryProfit||0)+\"'>\"+fmt(S.stat.cryProfit||0)+\"\u003c/b> · 24시간 거래\u003c/div>\";\n  $(\"cryGrid\").innerHTML=CRY.map(x=>{ const o=C.own[x.id], P=C.p[x.id], H=C.h[x.id], ch=(H[H.length-1]/H[0]-1)*100, pl=o.n?o.n*P*(1-CRY_FEE)-o.cost:0;\n    return '\u003cdiv class=\"fxC cryC\">\u003cdiv class=\"top\">\u003cspan class=\"fi\">'+x.ic+'\u003c/span>\u003cdiv class=\"nm\">\u003cb>'+x.n+'\u003c/b>'+(x.meme?' \u003cspan class=\"badge2\" style=\"background:#ff5b5b\">밈\u003c/span>':'')+'\u003cbr>\u003csmall>'+x.d+'\u003c/small>\u003c/div>\u003cdiv class=\"pr\">\u003cb>'+pfmt(P)+'\u003c/b>\u003cbr>\u003cspan class=\"'+cls(ch)+'\">'+sgn(ch)+'\u003c/span>\u003c/div>\u003c/div>\u003ccanvas width=\"400\" height=\"90\" data-id=\"'+x.id+'\">\u003c/canvas>'+\n      '\u003cdiv class=\"own\">'+(o.n?'보유 \u003cb>'+qfmt(o.n)+'개\u003c/b> · 평균 '+pfmt(o.cost/o.n)+' · 평가 '+fmt(o.n*P)+' · \u003cb class=\"'+cls(pl)+'\">'+(pl>=0?\"+\":\"−\")+fmt(Math.abs(pl))+' ('+sgn(o.cost?pl/o.cost*100:0)+')\u003c/b>':'보유 없음')+'\u003c/div>'+\n      '\u003cdiv class=\"btns\">\u003cbutton class=\"b\" data-f=\".1\" data-id=\"'+x.id+'\">10% 매수\u003c/button>\u003cbutton class=\"b\" data-f=\".5\" data-id=\"'+x.id+'\">50% 매수\u003c/button>\u003cbutton class=\"s\" data-f=\".5\" data-id=\"'+x.id+'\"'+(o.n?\"\":\" disabled\")+'>절반 매도\u003c/button>\u003cbutton class=\"s\" data-f=\"1\" data-id=\"'+x.id+'\"'+(o.n?\"\":\" disabled\")+'>전부 매도\u003c/button>\u003c/div>\u003c/div>'; }).join(\"\");\n  $(\"cryGrid\").querySelectorAll(\"canvas\").forEach(cv=>spark(cv,C.h[cv.dataset.id],C.h[cv.dataset.id][0]));\n  $(\"cryGrid\").querySelectorAll(\"button\").forEach(b=>b.onclick=()=>{ const x=CRY.find(y=>y.id===b.dataset.id); if(b.classList.contains(\"b\")) cryBuy(x,+b.dataset.f); else crySell(x,+b.dataset.f); }); }\nsetInterval(()=>{ if(S.cry&&S.mkt) cryTick(); },2000);\n\n/* ---------- 🎯 자동 익절·손절 ---------- */\nconst TPS=[0,10,30,100], SLS=[0,5,10,20];\nfunction renderKAuto(id){ const el=$(\"kAuto\"); if(!el) return; const a=S.sauto[id]||{tp:0,sl:0}, h=S.stk[id];\n  const html='\u003cdiv class=\"infoCard\">\u003ch4>🎯 자동 매도 예약 \u003csmall style=\"opacity:.6\">(보유 중일 때 조건이 되면 전부 팔아요)\u003c/small>\u003c/h4>'+\n    '\u003cdiv class=\"kv\">\u003cspan>📈 익절 (평균단가보다)\u003c/span>\u003cspan class=\"chips\">'+TPS.map(v=>'\u003cbutton data-tp=\"'+v+'\" class=\"'+(a.tp===v?\"on\":\"\")+'\">'+(v?\"+\"+v+\"%\":\"끔\")+'\u003c/button>').join(\"\")+'\u003c/span>\u003c/div>'+\n    '\u003cdiv class=\"kv\">\u003cspan>📉 손절 (평균단가보다)\u003c/span>\u003cspan class=\"chips\">'+SLS.map(v=>'\u003cbutton data-sl=\"'+v+'\" class=\"'+(a.sl===v?\"on\":\"\")+'\">'+(v?\"−\"+v+\"%\":\"끔\")+'\u003c/button>').join(\"\")+'\u003c/span>\u003c/div>'+\n    '\u003csmall style=\"opacity:.7\">'+(h.n?'지금 수익률 \u003cb class=\"'+cls(h.cost?(S.stkP[id]*(1-FEE)*h.n/h.cost-1)*100:0)+'\">'+sgn(h.cost?(S.stkP[id]*(1-FEE)*h.n/h.cost-1)*100:0)+'\u003c/b>':'주식을 사면 작동해요')+' · 진짜 투자자들은 \"손절은 짧게, 익절은 길게!\"라고 해요\u003c/small>\u003c/div>';\n  if(el._h===html) return; el._h=html; el.innerHTML=html;\n  el.querySelectorAll(\"button\").forEach(b=>b.onclick=()=>{ const s=S.sauto[id]||(S.sauto[id]={tp:0,sl:0}); if(b.dataset.tp!=null) s.tp=+b.dataset.tp; else s.sl=+b.dataset.sl; if(!s.tp&&!s.sl) delete S.sauto[id]; beep(800,.03,\"square\",.05); save(); renderKAuto(id); }); }\nfunction autoSellStk(id,why){ const k=STK.find(x=>x.id===id), h=S.stk[id], P=S.stkP[id], q=h.n; if(q\u003c1) return; const g=Math.floor(P*q*(1-FEE)), pr=g-h.cost; h.n=0; h.cost=0; S.stat.stkProfit+=pr; gain(g); S.dvol[id]+=q; S.stat.trades++; S.stat.autoSell=(S.stat.autoSell||0)+1;\n  S.tlog.unshift({id,b:0,q,p:P,t:Date.now()}); if(S.tlog.length>60) S.tlog.pop(); delete S.sauto[id];\n  toast((why===\"tp\"?\"🎯 익절 체결! \":\"🛑 손절 체결! \")+k.ic+\" \"+k.n+\" \"+fmt(q)+\"주 → \"+(pr>=0?\"+\":\"−\")+fmt(Math.abs(pr))); tone(why===\"tp\"?1319:300,.15,\"square\",.1); if(pr>0) coinCascade(8,50); save(); }\nsetInterval(()=>{ if(!S.sauto) return; for(const id i DN=[\"최근 악재 소식이 아직 덜 반영됐어요\",\"단기간에 많이 올라 차익 매물이 나올 수 있어요\",\"업종 분위기가 나빠지고 있어요\",\"실적 우려가 커지고 있어요\",\"큰손들이 팔고 나갈 신호가 보여요\"];\nfunction aiStockCard(k){ if(k.id===\"sMy\") return \"\"; if(!S.aiA) return '\u003cdiv class=\"infoCard aiCard\">\u003ch4>🤖 AI 전망\u003c/h4>\u003cdiv style=\"opacity:.8\">📊 주식 탭 → 🤖 AI 에서 AI 투자 분석가를 고용하면 이 종목의 앞으로 3분(하루) 전망을 알려줘요.\u003c/div>\u003c/div>';\n  const T0=Math.floor(S.mkt.tick/AI_WIN)*AI_WIN, pr=aiPredict(k,S.aiA,T0,120), P=S.stkP[k.id], tgt=P*(1+pr.p), why=(pr.p>=0?AI_WHY_UP:AI_WHY_DN)[Math.floor(hh(780,strSeed(k.id),T0/AI_WIN)*5)];\n  return '\u003cdiv class=\"infoCard aiCard\">\u003ch4>'+aiBadge(anaTier())+' 의 전망 \u003csmall style=\"opacity:.7\">(정확도 약 '+Math.round(aiAcc(S.aiA)*100)+'%)\u003c/small>\u003c/h4>\u003cdiv class=\"aiLine\">\u003cb class=\"'+cls(pr.p*100)+'\" style=\"font-size:1.3rem\">'+(pr.p>=0?\"📈 상승 예상 \":\"📉 하락 예상 \")+sgn(pr.p*100)+'\u003c/b>\u003cspan>목표가 \u003cb>'+pfmt(rt(tgt))+'\u003c/b>\u003c/span>\u003c/div>\u003cdiv style=\"opacity:.85\">💬 \"'+why+'\"\u003c/div>\u003csmall style=\"opacity:.6\">앞으로 약 3분(게임 하루) 기준 · 1분마다 다시 분석 · AI도 틀릴 수 있어요!\u003c/small>\u003c/div>'; }\n/* ---- AI 탭 (주식 → 🤖 AI) ---- */\nfunction renderAiSeg(){ const box=$(\"kAiSec\"); if(!box) return; const T=S.mkt.tick, T0=Math.floor(T/AI_WIN)*AI_WIN, lv=S.aiA, left=Math.ceil((T0+AI_WIN-T)*TICKMS/1000);\n  let h='\u003cdiv class=\"infoCard\">\u003ch4>🤖 AI 투자 분석가 '+(lv?aiBadge(anaTier())+' \u003csmall>Lv '+lv+'/'+AIA_MAX+'\u003c/small>':'')+'\u003c/h4>'+brandChips()+\n    (lv?'\u003cdiv class=\"kv\">\u003cspan>🎯 예측 정확도\u003c/span>\u003cb>약 '+Math.round(aiAcc(lv)*100)+'%\u003c/b>\u003c/div>\u003cdiv class=\"kv\">\u003cspan>📊 최근 실제 적중률\u003c/span>\u003cb>'+Math.round(aiHitRate(lv,T)*100)+'%\u003c/b>\u003c/div>\u003cdiv class=\"kv\">\u003cspan>🔄 다음 분석까지\u003c/span>\u003cb>'+left+'초\u003c/b>\u003c/div>':'\u003cdiv style=\"opacity:.85;margin:6px 0\">AI가 뉴스·거래량·업종 흐름을 분석해서 어떤 종목이 오를지 예측해 줘요. 레벨이 높을수록 더 똑똑한 모델로 업그레이드되고 정확도가 올라가요. (그래도 100%는 아니에요!)\u003c/div>')+\n    '\u003cdiv class=\"detBtns\" style=\"grid-template-columns:1fr\">\u003cbutton id=\"aiUp\"'+(lv>=AIA_MAX||bal()\u003caiACost()?\" disabled\":\"\")+'>'+(lv>=AIA_MAX?\"최고 모델이에요!\":(lv?\"⬆ 모델 업그레이드 (정확도 +3%) · 💰\":\"🤖 AI 분석가 고용 · 💰\")+fmt(aiACost()))+'\u003c/button>\u003c/div>\u003c/div>';\n  if(lv){ const pk=aiPicks(lv,T0,120,3), I=S.mkt.idxH, mk=STK.filter(k=>k.id===\"e1\")[0], ip=aiPredict(mk,lv,T0,120);\n    const row=x=>'\u003cdiv class=\"mv\" data-id=\"'+x.k.id+'\">\u003cb>'+x.k.ic+' '+x.k.n+'\u003c/b>\u003cspan class=\"'+cls(x.pr.p*100)+'\">'+sgn(x.pr.p*100)+' \u003csmall style=\"opacity:.7\">(신뢰 '+x.pr.conf+'%)\u003c/small>\u003c/span>\u003c/div>';\n    h+='\u003cdiv class=\"infoCard\">\u003ch4>🌐 시장 전망\u003c/h4>\u003cb class=\"'+cls(ip.p*100)+'\" style=\"font-size:1.1rem\">종합지수 '+(ip.p>=0?\"상승\":\"하락\")+' 예상 '+sgn(ip.p*100)+'\u003c/b>\u003cdiv style=\"opacity:.75;font-size:.78rem\">앞으로 약 3분(게임 하루) 기준\u003c/div>\u003c/div>'+\n      '\u003cdiv class=\"movers\">\u003cdiv>\u003ch5>🔥 AI 추천 매수\u003c/h5>'+pk.up.map(row).join(\"\")+'\u003c/div>\u003cdiv>\u003ch5>⚠️ 매도 주의\u003c/h5>'+pk.dn.map(row).join(\"\")+'\u003c/div>\u003c/div>';\n    // 뉴스 해석\n    const nw=S.news.filter(n=>n.id&&n.real).slice(0,5);\n    if(nw.length) h+='\u003cdiv class=\"infoCard\">\u003ch4>📰 AI 뉴스 해석\u003c/h4>'+nw.map(n=>{ const sure=hh(781,strSeed(n.text),lv)\u003caiAcc(lv), call=sure?n.real:-n.real; return '\u003cdiv class=\"nMini\">\u003csmall>'+ago(n.t)+'\u003c/small>'+n.text+'\u003cbr>\u003cb class=\"'+(call>0?\"up\":\"dn\")+'\">🤖 '+(call>0?\"실제로 오를 가능성이 높아 보여요\":\"실제로 떨어질 가능성이 높아 보여요\")+'\u003c/b>\u003c/div>'; }).join(\"\")+'\u003c/div>';\n    // 로보어드바이저\n    const R=S.robo, pl=R.val-R.prin;\n    h+='\u003cdiv class=\"infoCard roboCard\">\u003ch4>🦾 로보어드바이저 \u003csmall style=\"opacity:.7\">(AI가 내 돈을 대신 굴려요)\u003c/small>\u003c/h4>\u003cdiv style=\"font-size:.8rem;opacity:.85;margin-bottom:6px\">1분마다 '+aiBrand().n+'가 오를 것 같은 종목 3개를 골라 투자해요. 운용 수수료 1분에 0.1% · 찾을 때 수익의 10%는 성과보수예 mt(Math.abs(pr))); tone(pr>=0?1319:300,.12,\"square\",.1); if(pr>0) coinCascade(6,50); } save(); }\nfunction shortCheck(){ for(const id in S.short){ const s=S.short[id]; if(shortEq(id)\u003cs.coll*.25){ shortClose(id,true); toast(\"🚨 마진콜! \"+kName(id)+\" 공매도가 손실이 너무 커서 강제로 청산됐어요\"); thud(70,25,1,.4); } } }\nfunction renderKShort(id){ const el=$(\"kShort\"); if(!el) return; const k=STK.find(x=>x.id===id); if(k.etf||id===\"sMy\"){ el.innerHTML=\"\"; el._h=\"\"; return; } const s=S.short[id], P=S.stkP[id];\n  const h='\u003cdiv class=\"infoCard\">\u003ch4>📉 공매도 \u003csmall style=\"opacity:.6\">(주식을 빌려서 먼저 팔고, 떨어지면 싸게 사서 갚아 차익을 얻어요)\u003c/small>\u003c/h4>'+\n    (s?'\u003cdiv class=\"kv\">\u003cspan>공매도 수량\u003c/span>\u003cb>'+fmt(s.n)+'주 @'+pfmt(s.entry)+'\u003c/b>\u003c/div>\u003cdiv class=\"kv\">\u003cspan>담보금\u003c/span>\u003cb>'+fmt(s.coll)+'\u003c/b>\u003c/div>\u003cdiv class=\"kv\">\u003cspan>지금 청산하면\u003c/span>\u003cb class=\"'+cls(shortEq(id)-s.coll)+'\">'+fmt(shortEq(id))+' ('+(shortEq(id)-s.coll>=0?\"+\":\"−\")+fmt(Math.abs(shortEq(id)-s.coll))+')\u003c/b>\u003c/div>':'')+\n    '\u003cdiv class=\"detBtns\">\u003cbutton class=\"s\" data-sh=\"10\">10주\u003c/button>\u003cbutton class=\"s\" data-sh=\"100\">100주\u003c/button>\u003cbutton class=\"s\" data-sh=\"max\">최대\u003c/button>\u003cbutton data-sh=\"close\"'+(s?\"\":\" disabled\")+'>청산\u003c/button>\u003c/div>\u003csmall style=\"opacity:.7\">⚠️ 담보 150% 필요 · 하루 1% 빌림 수수료 · 주가가 오르면 손실! 손실이 담보의 75%를 넘으면 강제 청산(마진콜)\u003c/small>\u003c/div>';\n  if(el._h===h) return; el._h=h; el.innerHTML=h; el.querySelectorAll(\"[data-sh]\").forEach(b=>b.onclick=()=>{ const v=b.dataset.sh; if(v===\"close\") shortClose(id); else shortOpen(id,v===\"max\"?\"max\":+v); renderMarket(true); }); }\n/* ---- 🚀 스타트업 투자 (VC) · 모든 플레이어 같은 스타트업 ---- */\nconst VC_PRE=[\"딥\",\"넥스트\",\"오픈\",\"스마트\",\"그린\",\"퀀텀\",\"메타\",\"하이퍼\",\"블루\",\"픽셀\",\"로켓\",\"제로\"];\nconst VC_SUF=[[\"🤖\",\"AI랩스\",\"AI\"],[\"🧬\",\"바이오텍\",\"바이오\"],[\"🛵\",\"딜리버리\",\"배달\"],[\"💳 id].toFixed(2)); if(H.length>100) H.shift(); }); F._b=1; if(curView===\"fx\" && !ptrDown) renderFx(); }\n/* ---- 부동산 ---- */\nfunction reTick(){ const R=S.re, T=gTick();\n  REG.forEach(g=>{ R.idx[g]=reIdxAt(g,T); if(!R._b){ R.ih[g]=[]; for(let i=59;i>=1;i--) R.ih[g].push(+reIdxAt(g,T-i*7).toFixed(4)); } R.ih[g].push(+R.idx[g].toFixed(4)); if(R.ih[g].length>60) R.ih[g].shift(); });\n  RE.forEach(r=>{ const H=R.h[r.id]; if(!R._b){ H.length=0; for(let i=59;i>=1;i--) H.push(Math.round(r.p*reIdxAt(r.reg,T-i*7)*(r.fx?fxAt(r.fx,T-i*7)/FXL.find(y=>y.id===r.fx).p:1))); } H.push(rePrice(r)); if(H.length>60) H.shift(); }); R._b=1;\n  if(Date.now()>=R.next){ R.next=Date.now()+60000; let t=0; RE.forEach(r=>{ const o=R.own[r.id]; const w=o.n-(o.js||0); if(w>0) t+=reRent(r)*w; }); t=Math.floor(t); if(t>0){ gain(t); R.rent+=t; toast(\"🏠 월세 +\"+fmt(t)+\" 코인이 들어왔어요!\"); ping(1500,.12,.2); } }\n  if(curView===\"re\" && !ptrDown) renderRe(); }\n/* ---- 코인 ---- */\nfunction cryTick(){ const C=S.cry, T=gTick(); CRY.forEach(x=>{ C.p[x.id]=cryAt(x.id,T); const H=C.h[x.id]; if(!C._b){ H.length=0; for(let i=89;i>=1;i--) H.push(cryAt(x.id,T-i)); } H.push(C.p[x.id]); if(H.length>90) H.shift(); }); C._b=1; if(curView===\"cry\" && !ptrDown) renderCry(); }\n/* ---- 명품 ---- */\nfunction luxTick(){ const L=S.lux, T=gTick();\n  LUX.forEach(x=>{ if(x.k===\"walk\") L.m[x.id]=luxMAt(x.id,T); else { const o=L.own[x.id]; if(o.n) o.f=Math.max(x.floor,o.f*(1-x.dep)); } const H=L.h[x.id]; if(!L._b&&x.k===\"walk\"){ H.length=0; for(let i=59;i>=1;i--) H.push(x.p*luxMAt(x.id,T-i*3)); } H.push(x.k===\"walk\"?x.p*L.m[x.id]:x.p*L.own[x.id].f); if(H.length>60) H.shift(); }); L._b=1;\n  if(Date.now()>=L.next){ L.next=Date.now()+60000; const up=Math.floor(luxUpkeep()); if(up>0){ const pay=Math.min(up,Math.max(0,Math.floor(bal()))); spend(pay); L.paid+=pay; toast(\"🧾 명품 유지비(보험·관리비) −\"+fmt(pay)+(pay\u003cup?\" (돈이 모자라요!)\":\"\")); } }\n  if(curView===\"lux\" && !ptrDown) renderLux(); }\n/* ---- 공모주 ---- */\nfunction newIpo(){ S.ipo.cur=ipoAt(W_DAY(gTick())); }\nfunction initIpo(){ if(!S.ipo) S.ipo={cur:null,sub:0,hold:null,hist:[]}; const I=S.ipo; if(I.sub>0&&I.subD==null){ gain(I.sub); I.sub=0; } if(I.hold&&I.hold.D==null){ const g=Math.floor(I.hold.q*I.hold.p*(1-FEE)); gain(g); I.hold=null; } newIpo(); }\nfunction ipoSub(f){ const I=S.ipo, c=ipoAt(W_DAY(gTick())); if(f===\"x\"){ if(I.sub>0){ gain(I.sub); toast(\"↩️ 청약을 취소했어요. 증거금 \"+fmt(I.sub)+\" 반환\"); I.sub=0; } save(); renderMarket(true); return; }\n  const a=Math.floor(bal()*f); if(a\u003cc.pp*2){ toast(\"💸 최소 증거금은 \"+fmt(c.pp*2)+\" 코인이에요\"); return; } spend(a); I.sub+=a; I.subD=c.D; toast(\"🎟️ \"+c.n+\" 청약 완료! 증거금 \"+fmt(a)+\" (오늘 장 마감 때 배정)\"); ping(1300,.12,.2); save(); renderMarket(true); }\nfunction ipoSettle(){ const I=S.ipo; if(!I) return; const curD=W_DAY(gTick());\n  if(I.sub>0&&I.subD!=null&&I.subD\u003ccurD){ const c=ipoAt(I.subD), want=Math.floor(I.sub*2/c.pp); let n=Math.floor(want/c.comp); if(want>=10&&(c.comp\u003c500||hh(951,c.D,strSeed(S.pid||\"me\"))\u003c.5)) n+=1; n=Math.min(n,Math.floor(c.sh*.03)); const cost=n*c.pp, back=I.sub-cost; gain(back);\n    if(n>0){ if(I.hold) ipoSell(); I.hold={D:c.D,ic:c.ic,n:c.n,q:n,pp:c.pp,open:c.pp*c.mult,p:ipoPxAt(c.D,gTick()),h:[]}; toast(\"🎟️ \"+c.n+\" 경쟁률 \"+fmt(c.comp)+\":1 → \"+fmt(n)+\"주 배정! 남은 증거금 \"+fmt(back)+\" 환불\"); }\n    else toast(\"😢 \"+c.n+\" 경쟁률 \"+fmt(c.comp)+\":1 … 한 주도 못 받았어요. 증거금 전액 환불\");\n    I.sub=0; I.subD=null; }\n  I.hist=[]; for(let d=curD-1;d>=curD-8;d--){ const c=ipoAt(d); I.hist.push({ic:c.ic,n:c.n,comp:c.comp,mult:c.mult,pp:c.pp}); }\n  I.cur=ipoAt(curD); }\nfunction ipoDayEnd(){ ipoSettle(); }\nfunction ipoHoldTick(){ const H=S.ipo&&S.ipo.hold; if(!H) return; const T=gTick(), t0=(H.D+1)*DAYTICKS; H.p=ipoPxAt(H.D,T); H.h=[]; for(let t=Math.max(t0,T-80);t\u003c=T;t+=2) H.h.push(ipoPxAt(H.D,t)); if(H.h.length\u003c2) H.h=[H.pp,H.p];\n  if(T-t0>400){ toast(\"⏰ 공모주 상장 후 10분이 지나 자동으로 팔았어요\"); ipoSell(); } else if(curView===\"stk\"&&kSeg===\"ipo\"&&!ptrDown) renderIpo(); }\n/* ---- 시작할 때 맞추기 ---- */\nfunction worldInit(){ for(const id in stkImp) delete stkImp[id]; wLast=null; mTick(); if(S.fx){ S.fx._b=0; fxTick(); } if(S.re){ S.re._b=0; reTick(); } if(S.cry){ S.cry._b=0; cryTick(); } if(S.lux){ S.lux._b=0; luxTick(); } ipoSettle(); }\n\nload(); setCoins(coins); renderStatus();\nif (coins\u003c1) $(\"msg\").textContent=\"코인이 없어요! 💼 돈 벌기에서 일해서 벌어요 💪\";\nfor(let i=0;i\u003c26;i++){ const e=document.createElement(\"div\"); e.className=\"sp\"; e.textContent=\"✦\"; e.style.left=Math.random()*100+\"vw\"; e.style.top=Math.random()*100+\"vh\"; e.style.fontSize=(10+Math.random()*18)+\"px\"; e.style.animationDelay=(Math.random()*2.6)+\"s\"; e.style.animationDuration=(1.8+Math.random()*2)+\"s\"; document.body.appendChild(e); }\napplySkin(); applyFx(); renderWork(); setCoins(coins); updMini(); updAchBadge(); renderHist(); updPool(); updBadges();\n(function addX(){ document.querySelectorAll(\".overlay\").forEach(ov=>{ const box=ov.querySelector(\".paybox\"); if(!box||box.querySelector(\".xBtn\")) return; const w=document.createElement(\"div\"); w.className=\"xWrap\"; const b=document.createElement(\"button\"); b.className=\"xBtn\"; b.type=\"button\"; b.setAttribute(\"aria-label\",\"닫기\"); b.textContent=\"✕\";\n  b.onclick=()=>{ if(ov.id===\"ceoModal\"&&getComputedStyle($(\"ceoOk\")).display===\"none\"){ closeModal(\"ceoModal\"); ceoOpen=false; if(curView===\"co\") renderCo(); return; } const cb=[...box.querySelectorAll(\".closeBtn\")].find(x=>getComputedStyle(x).display!==\"none\"); if(cb) cb.click(); else closeModal(ov.id); };\n  w.appendChild(b); box.insertBefore(w,box.firstChild);\n  if(![\"introModal\",\"offModal\",\"ceoModal\"].includes(ov.id)) ov.addEventListener(\"click\",e=>{ if(e.target===ov) b.click(); }); }); })();\ninitMarket(); for(const id in S.theme){ const t=S.theme[id]; if(Math.abs(t.s)>.005) t.s=t.s>0?.0012:-.0016; } initFx(); initRe(); initLux(); initIpo(); initCry(); initFriends(); worldInit(); fixCity(); updVipTag();\nif(!S.seen) setTimeout(()=>openModal(\"introModal\"),500); else if(offlineInfo) setTimeout(showOffline,400);\nif(migMsg) setTimeout(()=>{ banner(\"💼 퇴직금 지급!\u003csmall>코인 클릭 대신 이제 직장에서 일해요 · +\"+fmt(migMsg)+\"\u003c/small>\",\"big\",3500); },1200);\nif(S.lastView===\"pet\") S.lastView=\"slot\";\nif(!S.petRef){ S.petRef=true; let rf=0; EGGS.forEach(e=>{ const n=S.ecnt[e.id]||0; if(n) rf+=e.base*(Math.pow(1.15,n)-1)/.15*.7; }); rf=Math.floor(rf); S.eq=[]; if(rf>0){ coins+=rf; setTimeout(()=>banner(\"🐾 펫 정리 환급금!\u003csmall>펫 기능이 없어지면서 알값의 70% +\"+fmt(rf)+\"\u003c/small>\",\"big\",3500),1800); } save(); }\nif(S.lastView && VIEWS[S.lastView] && S.lastView!==\"slot\"){ const lv=S.lastView; setTimeout(()=>showView(lv),50); }\ngoldenNext(25000,15000);\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}]</script>
