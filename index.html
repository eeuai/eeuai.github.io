<script>
(function () {
  var COLORS = ['#f0c13a', '#3fb68b', '#e8734a', '#4a9be8', '#d96aa7', '#9a85e0'];
  var MAX_GAME_BYTES = 6000000;
  var MAX_PAGE_BYTES = 15000000;
  var TOK_DATA = '@@GAME' + '_DATA@@';
  var TOK_TPL = '@@PAGE' + '_TEMPLATE@@';
  var FALLBACK_RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var SAMPLE_HTML = [
    '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">',
    '<style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#10181c;color:#fff;overflow:hidden;touch-action:manipulation}',
    '#hud{position:fixed;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:20px}',
    '#dot{position:absolute;width:64px;height:64px;border-radius:50%;background:#f0c13a;border:0;cursor:pointer}',
    '#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(16,24,28,.88);font-size:24px;text-align:center}',
    '#msg button{font:inherit;padding:10px 22px;border:0;border-radius:6px;background:#3fd9a0;color:#04231a;cursor:pointer}',
    '#msg[hidden],#dot[hidden]{display:none}</style>',
    '<div id="hud"><span>점수 <b id="s">0</b></span><span>남은 시간 <b id="t">15</b></span></div>',
    '<button id="dot" hidden aria-label="점"></button>',
    '<div id="msg"><div id="m">점을 최대한 많이 눌러요</div><button id="go">시작</button></div>',
    '<script>',
    'var s=0,t=15,timer,dot=document.getElementById("dot"),msg=document.getElementById("msg");',
    'function place(){dot.style.left=Math.random()*(innerWidth-64)+"px";dot.style.top=60+Math.random()*(innerHeight-130)+"px"}',
    'function start(){s=0;t=15;document.getElementById("s").textContent=0;document.getElementById("t").textContent=t;msg.hidden=true;dot.hidden=false;place();timer=setInterval(function(){t--;document.getElementById("t").textContent=t;if(t<=0)end()},1000)}',
    'function end(){clearInterval(timer);dot.hidden=true;document.getElementById("m").textContent="점수 "+s+"점";document.getElementById("go").textContent="다시 하기";msg.hidden=false}',
    'dot.onclick=function(){s++;document.getElementById("s").textContent=s;place()};',
    'document.getElementById("go").onclick=start;',
    '<\/script>'
  ].join('\n');

  /*BUILD_START*/
  function byteLen(s) { return new TextEncoder().encode(s).length; }
  function b64dec(b) {
    var bin = atob(b), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function currentReset() {
    var el = document.head && document.head.querySelector('style');
    var css = el ? el.textContent : '';
    return (css.indexOf('[hidden]') >= 0 && css.indexOf('safe-area-inset') >= 0) ? css : FALLBACK_RESET;
  }
  function buildDocument(list) {
    var raw = document.getElementById('tpl').textContent.trim();
    var tpl = b64dec(raw);
    var json = JSON.stringify(list).replace(/</g, '\\u003c');
    var content = tpl.replace(TOK_TPL, function () { return raw; }).replace(TOK_DATA, function () { return json; });
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + currentReset() + '</style></head><body>' + content + '</body></html>';
  }
  /*BUILD_END*/

  var $ = function (s) { return document.querySelector(s); };
  var games = readGames();
  var user = null, artifact = null;
  var me = { id: null, name: '', isOwner: false };
  var canPublish = false;
  var view = 'all';
  var mode = 'html';
  var toastTimer = null;

  function readGames() {
    try {
      var a = JSON.parse(document.getElementById('game-data').textContent);
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function hashIdx(id) {
    id = String(id || '');
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return h % COLORS.length;
  }
  function newId() {
    var a = new Uint8Array(8);
    try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < 8; i++) a[i] = Math.floor(Math.random() * 256); }
    return Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function fmtDate(ms) {
    if (!ms) return '';
    try { return new Date(ms).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }); } catch (e) { return ''; }
  }

  /* ---------- list ---------- */
  function render() {
    var list = $('#list');
    var sorted = games.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    var mine = sorted.filter(function (g) { return g.by && g.by === me.id; });
    if (view === 'mine' && !me.id) view = 'all';
    var shown = view === 'mine' ? mine : sorted;

    $('#count').textContent = (view === 'mine' ? '내가 올린 게임 ' : '게임 ') + shown.length + '개';
    $('#n-all').textContent = String(sorted.length);
    $('#n-mine').textContent = String(mine.length);
    $('#t-all').setAttribute('aria-pressed', String(view === 'all'));
    $('#t-mine').setAttribute('aria-pressed', String(view === 'mine'));
    list.textContent = '';

    if (!shown.length && view === 'mine') {
      list.append(emptyBox('아직 올린 게임이 없어요', canPublish ? '게임 올리기를 눌러 첫 게임을 올려 보세요. 올린 게임은 여기에 모여요.' : '내가 올린 게임이 생기면 여기에 모여요.', canPublish));
      return;
    }
    if (!shown.length) {
      list.append(emptyBox(
        '아직 올라온 게임이 없어요',
        canPublish ? '파일 하나로 된 HTML 게임을 올리면 누구나 바로 플레이할 수 있어요. Claude에게 "파일 하나짜리 HTML 게임 만들어줘"라고 부탁해서 만든 게임을 올려 보세요.' : '게임이 올라오면 여기에서 바로 플레이할 수 있어요.',
        canPublish
      ));
      return;
    }
    var shelf = el('div', 'shelf');
    shown.forEach(function (g) {
      try { shelf.append(card(g)); } catch (e) {}
    });
    list.append(shelf);
  }

  function emptyBox(title, text, withActions) {
    var box = el('div', 'empty');
    box.append(el('h2', null, title));
    if (text) box.append(el('p', null, text));
    if (withActions) {
      var row = el('div', 'row');
      var add = el('button', 'btn primary', '게임 올리기');
      add.type = 'button';
      add.addEventListener('click', openAdd);
      var sample = el('button', 'btn', '예시 게임 넣어보기');
      sample.type = 'button';
      sample.addEventListener('click', addSample);
      row.append(add, sample);
      box.append(row);
    }
    return box;
  }

  function whoOf(g) {
    if (g.byName) return g.byName;
    return g.by && g.by === me.id ? '내가 올림' : '';
  }

  function card(g) {
    var c = el('article', 'cart');
    c.style.setProperty('--c', COLORS[hashIdx(g.id)]);

    var label = el('div', 'cart-label');
    label.append(el('div', 'cart-glyph', Array.from(g.title || '?')[0] || '?'));
    label.append(el('span', 'cart-tag mono', g.type === 'link' ? 'LINK' : 'HTML'));
    c.append(label);

    var body = el('div', 'cart-body');
    body.append(el('h3', null, g.title || '이름 없는 게임'));
    if (g.desc) body.append(el('p', null, g.desc));
    var meta = el('div', 'meta');
    var who = whoOf(g);
    if (who) meta.append(el('span', null, who));
    var d = fmtDate(g.createdAt);
    if (d) meta.append(el('span', null, d));
    body.append(meta);
    c.append(body);

    var actions = el('div', 'cart-actions');
    var play = el('button', 'btn primary', g.type === 'link' ? '열기' : '플레이');
    play.type = 'button';
    play.addEventListener('click', function () { openGame(g, who); });
    actions.append(play);

    if (canPublish && (me.isOwner || (g.by && g.by === me.id))) {
      var del = el('button', 'btn danger', '삭제');
      del.type = 'button';
      var armed = false, t = null;
      del.addEventListener('click', function () {
        if (!armed) {
          armed = true;
          del.textContent = '정말 삭제';
          t = setTimeout(function () { armed = false; del.textContent = '삭제'; }, 3000);
          return;
        }
        clearTimeout(t);
        del.disabled = true;
        removeGame(g, del);
      });
      actions.append(del);
    }
    c.append(actions);
    c.append(el('div', 'cart-grip'));
    return c;
  }

  /* ---------- player ---------- */
  function openGame(g, who) {
    var player = $('#player'), frame = $('#p-frame'), msg = $('#p-msg'), mtext = $('#p-msg-text'), link = $('#p-link');
    $('#p-title').textContent = g.title || '';
    $('#p-by').textContent = who || '';
    player.hidden = false;
    document.body.style.overflow = 'hidden';
    frame.hidden = true;
    frame.srcdoc = '';
    link.hidden = true;
    msg.hidden = false;

    if (g.type === 'link') {
      mtext.textContent = '이 게임은 다른 사이트에 있어서 새 탭에서 열려요.';
      link.href = g.url;
      link.hidden = false;
      $('#p-full').hidden = true;
      return;
    }
    $('#p-full').hidden = false;
    if (!g.html) {
      mtext.textContent = '게임 파일을 찾지 못했어요. 올린 사람에게 다시 올려 달라고 부탁해 주세요.';
      return;
    }
    frame.srcdoc = g.html;
    frame.hidden = false;
    msg.hidden = true;
  }
  function closeGame() {
    $('#player').hidden = true;
    $('#p-frame').srcdoc = '';
    $('#p-frame').hidden = true;
    document.body.style.overflow = '';
  }

  /* ---------- saving (the page republishes itself) ---------- */
  async function commit(list) {
    if (!artifact) throw { code: 'not_granted' };
    var doc = buildDocument(list);
    if (byteLen(doc) > MAX_PAGE_BYTES) throw { code: 'too_large' };
    await artifact.publish(doc);
  }
  function publishErrorMessage(e) {
    var c = e && e.code;
    if (c === 'conflict') return '다른 사람이 먼저 저장했어요. 화면이 새로 열리면 한 번 더 시도해 주세요.';
    if (c === 'too_large') return '페이지 용량이 가득 찼어요. 안 쓰는 게임을 삭제하거나 더 작은 게임을 올려 주세요.';
    if (c === 'rate_limited') return '너무 자주 저장했어요. 잠시 뒤에 다시 해 주세요.';
    if (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'consent_required') {
      canPublish = false;
      applyAccessUi();
      render();
      return '이 계정은 게임을 올릴 수 없어요. 사이트 편집 권한이 필요해요.';
    }
    return '저장하지 못했어요. 잠시 뒤에 다시 시도해 주세요.';
  }

  /* ---------- add ---------- */
  function setMode(m) {
    mode = m;
    $('#m-html').setAttribute('aria-pressed', String(m === 'html'));
    $('#m-link').setAttribute('aria-pressed', String(m === 'link'));
    $('#box-html').hidden = m !== 'html';
    $('#box-link').hidden = m !== 'link';
    $('#f-err').textContent = '';
  }
  function openAdd() {
    if (!canPublish) { toast('올리려면 사이트 편집 권한이 필요해요.'); return; }
    $('#add-form').reset();
    $('#f-by').value = me.name || '';
    setMode('html');
    $('#add-sheet').hidden = false;
    $('#f-title').focus();
  }
  function closeAdd() { $('#add-sheet').hidden = true; }

  async function submitAdd(ev) {
    ev.preventDefault();
    var err = $('#f-err');
    err.textContent = '';
    var title = $('#f-title').value.trim();
    if (!title) { err.textContent = '게임 이름을 입력해 주세요.'; return; }

    var g = {
      id: newId(),
      title: title,
      desc: $('#f-desc').value.trim(),
      by: me.id,
      byName: $('#f-by').value.trim(),
      createdAt: Date.now()
    };
    if (mode === 'link') {
      var raw = $('#f-url').value.trim();
      var u;
      try { u = new URL(raw); } catch (e) { u = null; }
      if (!u || (u.protocol !== 'https:' && u.protocol !== 'http:')) {
        err.textContent = 'https://로 시작하는 주소를 입력해 주세요.';
        return;
      }
      g.type = 'link';
      g.url = u.href;
    } else {
      var html;
      var file = $('#f-file').files[0];
      if (file) {
        try { html = await file.text(); } catch (e) { err.textContent = '파일을 읽지 못했어요. 다시 선택해 주세요.'; return; }
      } else {
        html = $('#f-code').value;
      }
      if (!html || !html.trim()) { err.textContent = 'HTML 파일을 고르거나 코드를 붙여넣어 주세요.'; return; }
      var size = byteLen(html);
      if (size > MAX_GAME_BYTES) {
        err.textContent = '파일이 ' + (size / 1000000).toFixed(1) + 'MB예요. 6MB 이하로 줄여 주세요. 이미지 크기를 줄이면 도움이 돼요.';
        return;
      }
      g.type = 'html';
      g.html = html;
    }

    var btn = $('#add-submit');
    btn.disabled = true;
    btn.textContent = '올리는 중...';
    try {
      await commit(games.concat([g]));
      toast('올렸어요. 화면이 새로 열려요.');
      return;
    } catch (e) {
      err.textContent = publishErrorMessage(e);
    }
    btn.disabled = false;
    btn.textContent = '올리기';
  }

  async function addSample() {
    if (!canPublish) return;
    try {
      await commit(games.concat([{
        id: newId(),
        title: '점 잡기 (예시)',
        desc: '15초 동안 움직이는 점을 최대한 많이 누르는 예시 게임이에요.',
        type: 'html',
        html: SAMPLE_HTML,
        by: me.id,
        byName: me.name || '',
        createdAt: Date.now()
      }]));
      toast('예시 게임을 넣었어요. 화면이 새로 열려요.');
    } catch (e) {
      toast(publishErrorMessage(e));
    }
  }

  async function removeGame(g, btn) {
    try {
      await commit(games.filter(function (x) { return x.id !== g.id; }));
      toast('삭제했어요. 화면이 새로 열려요.');
    } catch (e) {
      toast(publishErrorMessage(e));
      if (btn) { btn.disabled = false; btn.textContent = '삭제'; }
    }
  }

  function applyAccessUi() {
    $('#open-add').hidden = !canPublish;
    $('#perm-note').hidden = !(me.id && !canPublish);
    $('#tabs').hidden = !me.id;
  }

  /* ---------- wiring ---------- */
  $('#open-add').addEventListener('click', openAdd);
  $('#add-cancel').addEventListener('click', closeAdd);
  $('#add-form').addEventListener('submit', submitAdd);
  $('#m-html').addEventListener('click', function () { setMode('html'); });
  $('#m-link').addEventListener('click', function () { setMode('link'); });
  $('#t-all').addEventListener('click', function () { view = 'all'; render(); });
  $('#t-mine').addEventListener('click', function () { view = 'mine'; render(); });
  $('#add-sheet').addEventListener('click', function (e) { if (e.target === this) closeAdd(); });
  $('#p-close').addEventListener('click', closeGame);
  $('#p-full').addEventListener('click', function () {
    var f = $('#p-frame');
    try {
      var p = f.requestFullscreen && f.requestFullscreen();
      if (p && p.catch) p.catch(function () { toast('이 화면에서는 전체 화면을 쓸 수 없어요.'); });
    } catch (e) { toast('이 화면에서는 전체 화면을 쓸 수 없어요.'); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('#player').hidden) closeGame();
    else if (!$('#add-sheet').hidden) closeAdd();
  });

  render();

  /* ---------- who is here (optional, signed-in viewers only) ---------- */
  (async function init() {
    var editable = false;
    try {
      if (typeof claude !== 'undefined' && claude && claude.use) {
        user = await claude.use('user');
        if (user) {
          var m = await user.me();
          me.id = m.id;
          me.name = m.name || '';
          me.isOwner = !!m.isOwner;
          editable = !!m.canEdit;
        }
        artifact = await claude.use('artifact');
      }
    } catch (e) {}
    canPublish = !!(artifact && editable);
    applyAccessUi();
    render();
  })();
})();
</script>
</body></html>
